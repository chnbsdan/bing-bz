name: 每日更新壁纸

on:
  schedule:
    - cron: '0 1 * * *'   # 每天UTC 1点（北京时间9点）
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 抓取壁纸
        run: npm run fetch

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picture/ webp/ data/
          git diff --staged --quiet || git commit -m "🖼️ 自动更新壁纸 $(date +'%Y-%m-%d')"
          git push
