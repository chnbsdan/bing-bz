<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* ===== 进度条 ===== */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2.5px;
            background: linear-gradient(90deg, #4fc3f7, #00e5ff);
            width: 0%;
            z-index: 9999;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(79, 195, 247, 0.4);
        }

        /* ===== 导航栏触发按钮 ===== */
        .nav-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: rgba(13, 13, 26, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            padding: 6px 12px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }

        .nav-toggle:hover {
            background: rgba(79, 195, 247, 0.12);
            border-color: rgba(79, 195, 247, 0.2);
        }

        /* ===== 导航栏（只有一个关闭按钮） ===== */
        .navbar {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(13, 13, 26, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
        }

        .navbar.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .navbar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .navbar .logo {
            color: #fff;
            font-size: 17px;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .navbar .logo .icon {
            font-size: 20px;
        }

        .navbar .logo span {
            color: #4fc3f7;
            font-weight: 600;
        }

        /* ★★★ 只有一个关闭按钮 ★★★ */
        .navbar-close {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: 0.2s;
            line-height: 1.4;
        }

        .navbar-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .navbar .badge {
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
        }

        .navbar .badge span {
            color: rgba(255, 255, 255, 0.4);
        }

        .navbar .search-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .navbar .search-box input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 5px 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        .navbar .search-box input:focus {
            border-color: #4fc3f7;
            background: rgba(255, 255, 255, 0.08);
        }

        .navbar .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .navbar .search-box .search-btn {
            background: rgba(79, 195, 247, 0.12);
            border: none;
            color: #4fc3f7;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .navbar .search-box .search-btn:hover {
            background: rgba(79, 195, 247, 0.2);
            color: #fff;
        }

        .navbar .nav-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .navbar .nav-actions button {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            color: rgba(255, 255, 255, 0.4);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .navbar .nav-actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ===== 应用容器 ===== */
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        /* ===== 网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            flex: 1;
            align-content: start;
            overflow-y: auto;
            padding: 4px;
            padding-bottom: 70px;
            scroll-behavior: smooth;
            min-height: 0;
        }

        .grid::-webkit-scrollbar {
            width: 6px;
        }

        .grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .grid::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== 卡片 ===== */
        .card {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            background: #1a1a2e;
            aspect-ratio: 16 / 9;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card img.loaded {
            opacity: 1;
        }

        .card .placeholder-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.7);
            transform: scale(1.05);
            transition: opacity 0.6s ease;
            z-index: 1;
        }

        .card .placeholder-bg.hidden {
            opacity: 0;
        }

        /* ===== 悬停信息 ===== */
        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 16px 12px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info {
            opacity: 1;
        }

        .card .info .date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .card .info .title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .copyright {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 分页控制栏 ===== */
        .pagination {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(13, 13, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #e0e0e0;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(79, 195, 247, 0.2);
            color: #4fc3f7;
        }

        .pagination button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            white-space: nowrap;
        }

        .pagination .total-info {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            white-space: nowrap;
        }

        .pagination .goto-box {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pagination .goto-box input {
            width: 48px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 4px 6px;
            color: #fff;
            font-size: 13px;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        .pagination .goto-box input:focus {
            border-color: #4fc3f7;
        }

        .pagination .goto-box input::-webkit-outer-spin-button,
        .pagination .goto-box input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .pagination .goto-box input[type=number] {
            -moz-appearance: textfield;
        }

        .pagination .goto-box .goto-btn {
            background: rgba(79, 195, 247, 0.15);
            border: none;
            color: #4fc3f7;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .pagination .goto-box .goto-btn:hover {
            background: rgba(79, 195, 247, 0.3);
            color: #fff;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.15);
        }

        .empty .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* ============================================================
           全屏预览遮罩
           ============================================================ */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            overflow: hidden;
            user-select: none;
        }

        .overlay.active {
            display: block;
        }

        .overlay .close {
            position: fixed;
            top: 16px;
            right: 24px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 34px;
            cursor: pointer;
            z-index: 100;
            font-family: serif;
            line-height: 1;
            transition: 0.2s;
            background: transparent;
            border: none;
        }

        .overlay .close:hover {
            color: #fff;
        }

        .overlay .action-buttons {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .overlay:hover .action-buttons {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay .action-buttons a,
        .overlay .action-buttons button {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 13px;
            padding: 5px 16px;
            border-radius: 6px;
            transition: 0.2s;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        .overlay .action-buttons a:hover,
        .overlay .action-buttons button:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
        }

        .overlay .action-buttons .btn-download {
            color: #4fc3f7;
            border-color: rgba(79, 195, 247, 0.15);
        }

        .overlay .action-buttons .btn-download:hover {
            color: #fff;
            border-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.08);
        }

        .overlay .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
        }

        .overlay .image-container:active {
            cursor: grabbing;
        }

        .overlay .preview-image {
            display: block;
            max-width: none;
            max-height: none;
            pointer-events: none;
            transform-origin: center center;
            transition: none;
            will-change: transform;
            width: auto;
            height: auto;
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .overlay .meta {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 17px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 20px;
            border-radius: 10px;
            max-width: 80%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .overlay:hover .meta {
            opacity: 1;
        }

        .overlay .meta .date {
            font-size: 13px;
            opacity: 0.4;
            display: block;
            margin-top: 2px;
        }

        .overlay .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.1);
            font-size: 44px;
            cursor: pointer;
            padding: 16px 10px;
            z-index: 50;
            font-family: serif;
            line-height: 1;
            user-select: none;
            transition: 0.2s;
            background: transparent;
            border: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay:hover .arrow {
            opacity: 1;
        }

        .overlay .arrow:hover {
            color: #fff;
        }

        .overlay .arrow-left {
            left: 8px;
        }

        .overlay .arrow-right {
            right: 8px;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .navbar {
                min-width: 160px;
                padding: 12px 14px;
                top: 10px;
                left: 10px;
            }
            .navbar .logo {
                font-size: 15px;
            }
            .nav-toggle {
                font-size: 18px;
                padding: 5px 10px;
                top: 10px;
                left: 10px;
            }
            .pagination {
                padding: 6px 12px;
                gap: 6px;
                bottom: 12px;
            }
            .pagination button {
                font-size: 12px;
                padding: 4px 10px;
            }
            .pagination .page-info {
                font-size: 12px;
            }
            .pagination .goto-box input {
                width: 40px;
                font-size: 12px;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                padding-bottom: 80px;
            }
            .card {
                aspect-ratio: 16 / 10;
            }
            .navbar {
                min-width: 140px;
                padding: 10px 12px;
                top: 8px;
                left: 8px;
            }
            .navbar .logo {
                font-size: 14px;
            }
            .navbar .logo .icon {
                font-size: 16px;
            }
            .navbar .search-box input {
                font-size: 12px;
                padding: 4px 8px;
            }
            .navbar .search-box .search-btn {
                font-size: 12px;
                padding: 4px 8px;
            }
            .navbar .nav-actions button {
                font-size: 12px;
                padding: 4px 8px;
            }
            .navbar-close {
                font-size: 16px;
                padding: 0 6px;
            }
            .nav-toggle {
                font-size: 16px;
                padding: 4px 8px;
                top: 8px;
                left: 8px;
            }
            .pagination {
                flex-wrap: wrap;
                justify-content: center;
                padding: 6px 10px;
                gap: 4px;
                max-width: 98vw;
                bottom: 8px;
            }
            .pagination button {
                font-size: 11px;
                padding: 3px 8px;
            }
            .pagination .page-info {
                font-size: 11px;
            }
            .pagination .total-info {
                font-size: 10px;
            }
            .pagination .goto-box input {
                width: 34px;
                font-size: 11px;
                padding: 2px 4px;
            }
            .pagination .goto-box .goto-btn {
                font-size: 11px;
                padding: 2px 8px;
            }
            .overlay .arrow {
                font-size: 26px;
                padding: 8px 4px;
            }
            .overlay .arrow-left {
                left: 2px;
            }
            .overlay .arrow-right {
                right: 2px;
            }
            .overlay .close {
                font-size: 26px;
                top: 10px;
                right: 14px;
            }
            .overlay .action-buttons {
                bottom: 60px;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .overlay .action-buttons a,
            .overlay .action-buttons button {
                font-size: 11px;
                padding: 4px 10px;
            }
            .overlay .meta {
                font-size: 13px;
                padding: 5px 12px;
                bottom: 105px;
                max-width: 90%;
            }
            .overlay .meta .date {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 进度条 ===== -->
    <div id="progress-bar"></div>

    <!-- ===== 导航栏触发按钮 ===== -->
    <button class="nav-toggle" id="navToggle" aria-label="切换导航">☰</button>

    <!-- ===== 浮动导航栏 ===== -->
    <div class="navbar" id="navbar">
        <div class="navbar-header">
            <div class="logo">
                <span class="icon">🌅</span>
                Bing <span>Wallpaper</span>
            </div>
            <!-- ★★★ 只有一个关闭按钮 ★★★ -->
            <button class="navbar-close" id="navClose">✕</button>
        </div>
        <div class="badge"><span id="totalNavCount">0</span> 张</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索年份/关键词..." />
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
        <div class="nav-actions">
            <button id="homeBtn">🏠 首页</button>
        </div>
    </div>

    <!-- ===== 应用容器 ===== -->
    <div class="app">
        <div class="grid" id="grid"></div>
    </div>

    <!-- ===== 分页控制栏 ===== -->
    <div class="pagination" id="pagination">
        <button id="prevBtn" disabled>‹ 上一页</button>
        <span class="page-info" id="pageInfo">第 1 / 1 页</span>
        <span class="total-info" id="totalInfo">共 0 张</span>
        <button id="nextBtn">下一页 ›</button>

        <div class="goto-box">
            <input type="number" id="gotoInput" min="1" placeholder="页" />
            <button class="goto-btn" id="gotoBtn">跳转</button>
        </div>
    </div>

    <!-- ===== 全屏预览遮罩 ===== -->
    <div class="overlay" id="overlay">
        <button class="close" id="closeBtn">&times;</button>
        <button class="arrow arrow-left" id="prevPreviewBtn">‹</button>
        <button class="arrow arrow-right" id="nextPreviewBtn">›</button>
        <div class="image-container" id="imageContainer">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>
        <div class="action-buttons">
            <a href="#" id="openLinkBtn" target="_blank" rel="noopener">🔗 打开链接</a>
            <button class="btn-download" id="downloadBtn">⬇️ 下载4K图片</button>
        </div>
        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        function fixImagePath(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/bing-img/')) return url;
            if (url.startsWith('/')) {
                return `${BASE_PATH}${url}`;
            }
            return url;
        }

        function getImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            return fixImagePath(url);
        }

        // ============================================================
        // 2. 进度条
        // ============================================================
        const progressBar = document.getElementById('progress-bar');

        function showProgress() {
            progressBar.style.width = '30%';
            setTimeout(() => { progressBar.style.width = '60%'; }, 150);
        }

        function hideProgress() {
            progressBar.style.width = '100%';
            setTimeout(() => { progressBar.style.width = '0%'; }, 350);
        }

        // ============================================================
        // 3. 导航栏
        // ============================================================
        const navToggle = document.getElementById('navToggle');
        const navbar = document.getElementById('navbar');
        const navClose = document.getElementById('navClose');
        let navOpen = false;

        function toggleNav(open) {
            navOpen = open !== undefined ? open : !navOpen;
            navbar.classList.toggle('open', navOpen);
            navToggle.textContent = navOpen ? '✕' : '☰';
        }

        navToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleNav();
        });

        navClose.addEventListener('click', () => {
            toggleNav(false);
        });

        document.addEventListener('click', (e) => {
            if (navOpen && !navbar.contains(e.target) && e.target !== navToggle) {
                toggleNav(false);
            }
        });

        // ============================================================
        // 4. ★★★ 分页数据加载 ★★★
        // ============================================================
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const PAGE_SIZE = 42;
        let totalPages = 1;
        let currentPreviewIndex = 0;
        let currentPreviewItem = null;

        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const imageContainer = document.getElementById('imageContainer');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewDate = document.getElementById('previewDate');
        const totalNavCount = document.getElementById('totalNavCount');
        const openLinkBtn = document.getElementById('openLinkBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const homeBtn = document.getElementById('homeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const totalInfo = document.getElementById('totalInfo');
        const gotoInput = document.getElementById('gotoInput');
        const gotoBtn = document.getElementById('gotoBtn');

        // 缩放状态
        let scale = 1;
        let minScale = 0.3;
        let maxScale = 5;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let lastTranslateX = 0;
        let lastTranslateY = 0;

        // ============================================================
        // 4.1 加载数据
        // ============================================================
        async function loadData() {
            showProgress();
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    hideProgress();
                    return;
                }
                allData.sort((a, b) => b.date.localeCompare(a.date));
                filteredData = [];
                totalNavCount.textContent = allData.length;
                totalInfo.textContent = `共 ${allData.length} 张`;
                currentPage = 1;
                renderPage(1);
                hideProgress();
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
                hideProgress();
            }
        }

        // ============================================================
        // 4.2 渲染页面
        // ============================================================
        function renderPage(page) {
            const data = filteredData.length > 0 ? filteredData : allData;
            totalPages = Math.ceil(data.length / PAGE_SIZE);

            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            if (totalPages === 0) {
                showEmpty();
                return;
            }

            currentPage = page;
            const start = (page - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, data.length);
            const items = data.slice(start, end);

            grid.innerHTML = '';

            if (items.length === 0) {
                showEmpty();
                return;
            }

            items.forEach((item, index) => {
                const realIndex = start + index;
                const card = document.createElement('div');
                card.className = 'card';

                const imgSrc = getImageUrl(item.webp || item.jpg || '');
                const fallback = getImageUrl(item.jpg || '');

                let placeholderSrc = imgSrc;
                if (imgSrc.includes('th?id=')) {
                    placeholderSrc = imgSrc.includes('?') ?
                        `${imgSrc}&w=200` :
                        `${imgSrc}?w=200`;
                }

                card.innerHTML = `
                    <div class="placeholder-bg" style="background-image: url('${placeholderSrc}');"></div>
                    <img src="${imgSrc}" 
                         alt="${item.copyright || item.date}" 
                         loading="lazy" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;

                const img = card.querySelector('img');
                const placeholderBg = card.querySelector('.placeholder-bg');

                img.addEventListener('load', () => {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                });

                if (img.complete) {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                }

                img.addEventListener('error', () => {
                    if (fallback && fallback !== imgSrc) {
                        img.src = fallback;
                    } else {
                        img.classList.add('loaded');
                        placeholderBg.classList.add('hidden');
                    }
                });

                card.addEventListener('click', () => {
                    let targetIndex = realIndex;
                    if (allData.length > 0) {
                        const found = allData.findIndex(d => d.date === item.date);
                        if (found >= 0) targetIndex = found;
                    }
                    openPreview(targetIndex);
                });

                grid.appendChild(card);
            });

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
            gotoInput.max = totalPages;
            gotoInput.placeholder = `1-${totalPages}`;

            grid.scrollTop = 0;
        }

        // ============================================================
        // 4.3 分页事件
        // ============================================================
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) renderPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) renderPage(currentPage + 1);
        });

        gotoBtn.addEventListener('click', () => {
            const val = parseInt(gotoInput.value);
            if (!isNaN(val) && val >= 1 && val <= totalPages) {
                renderPage(val);
            }
            gotoInput.value = '';
        });

        gotoInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') gotoBtn.click();
        });

        // ============================================================
        // 4.4 ★★★ 搜索（支持 202607 格式） ★★★
        // ============================================================
        function doSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) {
                filteredData = [];
                renderPage(1);
                return;
            }

            filteredData = allData.filter(item => {
                const title = (item.title || '').toLowerCase();
                const copyright = (item.copyright || '').toLowerCase();
                const date = item.date || '';

                // ★★★ 支持 202607 格式匹配 2026-07-xx ★★★
                const dateClean = date.replace(/-/g, '');
                const dateMatch = date.includes(keyword) || dateClean.includes(keyword);

                return title.includes(keyword) || copyright.includes(keyword) || dateMatch;
            });

            if (filteredData.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div class="icon">🔍</div>
                        <div>没有匹配"${keyword}"的壁纸</div>
                    </div>
                `;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pageInfo.textContent = '第 0 / 0 页';
                return;
            }
            renderPage(1);
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // ============================================================
        // 4.5 首页
        // ============================================================
        homeBtn.addEventListener('click', () => {
            searchInput.value = '';
            filteredData = [];
            renderPage(1);
            toggleNav(false);
        });

        // ============================================================
        // 4.6 空状态
        // ============================================================
        function showEmpty() {
            grid.innerHTML = `
                <div class="empty">
                    <div class="icon">🖼️</div>
                    <div>暂无壁纸数据</div>
                </div>
            `;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '第 0 / 0 页';
            totalInfo.textContent = '共 0 张';
            totalNavCount.textContent = '0';
        }

        // ============================================================
        // 5. 全屏预览
        // ============================================================
        function openPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = 0;
            if (index >= allData.length) index = allData.length - 1;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];
            resetZoom();
            showPreview(currentPreviewIndex);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateActionButtons();
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];

            const imgSrc = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewImg.src = imgSrc;
            previewTitle.textContent = currentPreviewItem.title || currentPreviewItem.copyright || '';
            previewDate.textContent = currentPreviewItem.date || '';
            updateActionButtons();
            resetZoom();
        }

        function updateActionButtons() {
            if (!currentPreviewItem) return;
            const url = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            openLinkBtn.href = url;
            downloadBtn.onclick = function(e) {
                e.preventDefault();
                downloadImage(url);
            };
        }

        async function downloadImage(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                const fileName = url.split('/').pop().split('?')[0] || 'wallpaper.jpg';
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (err) {
                window.open(url, '_blank');
            }
        }

        function closePreview() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== 缩放 =====
        function updateTransform() {
            previewImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            previewImg.style.width = 'auto';
            previewImg.style.height = 'auto';
            previewImg.style.maxWidth = '95vw';
            previewImg.style.maxHeight = '85vh';
            updateTransform();
        }

        // ===== 拖拽 =====
        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            const pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = e.type === 'mousemove' ? e : e.touches[0];
            const dx = pos.clientX - startX;
            const dy = pos.clientY - startY;
            translateX = lastTranslateX + dx;
            translateY = lastTranslateY + dy;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        function wheelZoom(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (newScale > 1) {
                previewImg.style.maxWidth = 'none';
                previewImg.style.maxHeight = 'none';
            } else {
                previewImg.style.maxWidth = '95vw';
                previewImg.style.maxHeight = '85vh';
                translateX = 0;
                translateY = 0;
            }
            scale = newScale;
            updateTransform();
        }

        // ============================================================
        // 6. 事件绑定
        // ============================================================
        document.getElementById('closeBtn').addEventListener('click', closePreview);
        document.getElementById('prevPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
        });
        document.getElementById('nextPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
        });

        imageContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);

        imageContainer.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });

        imageContainer.addEventListener('wheel', wheelZoom, { passive: false });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePreview();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') showPreview(currentPreviewIndex - 1);
            if (e.key === 'ArrowRight') showPreview(currentPreviewIndex + 1);
        });

        // ============================================================
        // 7. 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
