<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== 网格容器 ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }

        /* ===== 网格：7列 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            flex: 1;
            align-content: start;
            overflow: hidden;
        }

        .card {
            position: relative;
            aspect-ratio: 16 / 11;
            background: #1a1a2e;
            overflow: hidden;
            cursor: pointer;
            border-radius: 4px;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 8px 6px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info {
            opacity: 1;
        }

        .card .info .date {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }

        .card .info .title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .copyright {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 第一个卡片：网站标识 ===== */
        .card.featured {
            background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 12px;
            cursor: default;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card.featured:hover .info {
            opacity: 0;
        }

        .card.featured .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .card.featured .logo span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .card.featured .sub {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 2px;
            letter-spacing: 3px;
        }

        /* ===== 分页控制栏 ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 10px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #e0e0e0;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            min-width: 80px;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(79, 195, 247, 0.25);
            color: #4fc3f7;
        }

        .pagination button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            min-width: 120px;
            text-align: center;
        }

        .pagination .total-info {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }

        /* ===== 空状态 ===== */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* ===== 全屏预览遮罩（保持不变） ===== */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            overflow: hidden;
            user-select: none;
        }

        .overlay.active {
            display: block;
        }

        .overlay .close {
            position: fixed;
            top: 20px;
            right: 28px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 36px;
            cursor: pointer;
            z-index: 100;
            font-family: serif;
            line-height: 1;
            transition: 0.2s;
        }

        .overlay .close:hover {
            color: #fff;
        }

        .overlay .zoom-controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        .overlay .zoom-controls button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 4px;
            transition: 0.2s;
            font-family: serif;
            line-height: 1;
        }

        .overlay .zoom-controls button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .overlay .zoom-controls .zoom-level {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            min-width: 44px;
            text-align: center;
            line-height: 32px;
            font-family: sans-serif;
        }

        .overlay .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
        }

        .overlay .image-container:active {
            cursor: grabbing;
        }

        .overlay .preview-image {
            display: block;
            max-width: none;
            max-height: none;
            pointer-events: none;
            transform-origin: center center;
            transition: none;
            will-change: transform;
            width: auto;
            height: auto;
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .overlay .meta {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            max-width: 80%;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 50;
        }

        .overlay .meta .date {
            font-size: 11px;
            opacity: 0.5;
            display: block;
        }

        .overlay .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 48px;
            cursor: pointer;
            padding: 20px 12px;
            z-index: 50;
            font-family: serif;
            line-height: 1;
            user-select: none;
            transition: 0.2s;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .overlay .arrow:hover {
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
        }

        .overlay .arrow-left {
            left: 10px;
        }

        .overlay .arrow-right {
            right: 10px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
            }
            .card {
                aspect-ratio: 16 / 12;
            }
            .card.featured .logo {
                font-size: 16px;
            }
            .card.featured .sub {
                font-size: 8px;
            }
            .pagination {
                gap: 8px;
                flex-wrap: wrap;
            }
            .pagination button {
                padding: 6px 12px;
                font-size: 12px;
                min-width: 60px;
            }
            .pagination .page-info {
                font-size: 12px;
                min-width: 80px;
            }
            .overlay .arrow {
                font-size: 28px;
                padding: 10px 4px;
            }
            .overlay .arrow-left {
                left: 2px;
            }
            .overlay .arrow-right {
                right: 2px;
            }
            .overlay .close {
                font-size: 28px;
                top: 12px;
                right: 16px;
            }
            .overlay .zoom-controls {
                bottom: 70px;
                padding: 4px 12px;
                gap: 6px;
            }
            .overlay .zoom-controls button {
                font-size: 18px;
                padding: 2px 8px;
            }
            .overlay .meta {
                font-size: 11px;
                padding: 4px 12px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 图片网格 ===== -->
        <div class="grid" id="grid">
            <div class="card featured">
                <div class="logo">Bing <span>Wallpaper</span></div>
                <div class="sub">每日精选</div>
            </div>
        </div>

        <!-- ===== 分页控制栏 ===== -->
        <div class="pagination">
            <button id="prevBtn" disabled>‹ 上一页</button>
            <span class="page-info" id="pageInfo">第 1 / 1 页</span>
            <span class="total-info" id="totalInfo">共 0 张</span>
            <button id="nextBtn">下一页 ›</button>
        </div>
    </div>

    <!-- ===== 全屏预览遮罩 ===== -->
    <div class="overlay" id="overlay">
        <span class="close" id="closeBtn">&times;</span>
        <span class="arrow arrow-left" id="prevPreviewBtn">‹</span>
        <span class="arrow arrow-right" id="nextPreviewBtn">›</span>
        <div class="image-container" id="imageContainer">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>
        <div class="zoom-controls">
            <button id="zoomOutBtn">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button id="zoomInBtn">+</button>
            <button id="zoomResetBtn" style="font-size:16px;">⟲</button>
        </div>
        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        function fixImagePath(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/bing-img/')) return url;
            if (url.startsWith('/')) {
                return `${BASE_PATH}${url}`;
            }
            return url;
        }

        // ============================================================
        // 2. 数据 + 分页
        // ============================================================
        let allData = [];
        let currentPage = 0;
        const PAGE_SIZE = 42; // 7列 × 6行
        let currentPreviewIndex = 0;

        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const imageContainer = document.getElementById('imageContainer');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewDate = document.getElementById('previewDate');
        const zoomLevel = document.getElementById('zoomLevel');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const totalInfo = document.getElementById('totalInfo');

        // 缩放状态
        let scale = 1;
        let minScale = 0.3;
        let maxScale = 5;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let lastTranslateX = 0;
        let lastTranslateY = 0;

        // ===== 加载数据 =====
        async function loadData() {
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    return;
                }
                allData.sort((a, b) => b.date.localeCompare(a.date));
                totalInfo.textContent = `共 ${allData.length} 张`;
                currentPage = 0;
                renderPage(0);
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
            }
        }

        // ===== 渲染指定页 =====
        function renderPage(page) {
            const totalPages = Math.ceil(allData.length / PAGE_SIZE);
            if (page < 0) page = 0;
            if (page >= totalPages) page = totalPages - 1;
            if (page < 0 || totalPages === 0) return;

            currentPage = page;
            const start = page * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allData.length);
            const slice = allData.slice(start, end);

            // 移除旧的卡片（保留第一个 featured）
            const oldCards = grid.querySelectorAll('.card:not(.featured)');
            oldCards.forEach(el => el.remove());

            // 如果当前页没有数据，显示空状态
            if (slice.length === 0) {
                showEmpty();
                return;
            }

            slice.forEach((item, index) => {
                const realIndex = start + index;
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = fixImagePath(item.webp || item.jpg || '');
                const fallback = fixImagePath(item.jpg || '');

                card.innerHTML = `
                    <img src="${imgSrc}" alt="${item.copyright || item.date}" loading="lazy" 
                         onerror="this.src='${fallback}'" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openPreview(realIndex);
                });

                grid.appendChild(card);
            });

            // 更新分页按钮状态
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= totalPages - 1;
            pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 页`;
        }

        // ===== 分页按钮事件 =====
        prevBtn.addEventListener('click', () => {
            if (currentPage > 0) renderPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(allData.length / PAGE_SIZE);
            if (currentPage < totalPages - 1) renderPage(currentPage + 1);
        });

        // ===== 空状态 =====
        function showEmpty() {
            const oldCards = grid.querySelectorAll('.card:not(.featured)');
            oldCards.forEach(el => el.remove());
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.innerHTML = `
                <div class="icon">🖼️</div>
                <div>暂无壁纸数据</div>
            `;
            grid.appendChild(empty);
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '第 0 / 0 页';
            totalInfo.textContent = '共 0 张';
        }

        // ============================================================
        // 3. 全屏预览
        // ============================================================
        function openPreview(index) {
            if (allData.length === 0) return;
            currentPreviewIndex = index;
            resetZoom();
            showPreview(currentPreviewIndex);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;

            const item = allData[currentPreviewIndex];
            const imgSrc = fixImagePath(item.jpg || item.webp || '');
            previewImg.src = imgSrc;
            previewTitle.textContent = item.title || item.copyright || '';
            previewDate.textContent = item.date || '';
            resetZoom();
        }

        function closePreview() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== 缩放 =====
        function updateTransform() {
            previewImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            zoomLevel.textContent = `${Math.round(scale * 100)}%`;
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            previewImg.style.width = 'auto';
            previewImg.style.height = 'auto';
            previewImg.style.maxWidth = '95vw';
            previewImg.style.maxHeight = '90vh';
            updateTransform();
        }

        function zoomIn() {
            if (scale >= maxScale) return;
            previewImg.style.maxWidth = 'none';
            previewImg.style.maxHeight = 'none';
            scale = Math.min(scale + 0.2, maxScale);
            updateTransform();
        }

        function zoomOut() {
            if (scale <= minScale) return;
            scale = Math.max(scale - 0.2, minScale);
            if (scale <= 1) {
                previewImg.style.maxWidth = '95vw';
                previewImg.style.maxHeight = '90vh';
                translateX = 0;
                translateY = 0;
            }
            updateTransform();
        }

        // ===== 拖拽 =====
        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            const pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = e.type === 'mousemove' ? e : e.touches[0];
            const dx = pos.clientX - startX;
            const dy = pos.clientY - startY;
            translateX = lastTranslateX + dx;
            translateY = lastTranslateY + dy;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        function wheelZoom(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (newScale > 1) {
                previewImg.style.maxWidth = 'none';
                previewImg.style.maxHeight = 'none';
            } else {
                previewImg.style.maxWidth = '95vw';
                previewImg.style.maxHeight = '90vh';
                translateX = 0;
                translateY = 0;
            }
            scale = newScale;
            updateTransform();
        }

        // ============================================================
        // 4. 事件绑定
        // ============================================================
        document.getElementById('closeBtn').addEventListener('click', closePreview);
        document.getElementById('prevPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
        });
        document.getElementById('nextPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
        });
        document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
        document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
        document.getElementById('zoomResetBtn').addEventListener('click', resetZoom);

        imageContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);

        imageContainer.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });

        imageContainer.addEventListener('wheel', wheelZoom, { passive: false });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePreview();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') showPreview(currentPreviewIndex - 1);
            if (e.key === 'ArrowRight') showPreview(currentPreviewIndex + 1);
            if (e.key === '+' || e.key === '=') zoomIn();
            if (e.key === '-') zoomOut();
            if (e.key === '0') resetZoom();
        });

        // ============================================================
        // 5. 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
