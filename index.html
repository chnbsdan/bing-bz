<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --bg-primary: #0d0d1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #1a1a2e;
            --text-primary: #fff;
            --text-secondary: rgba(255,255,255,0.5);
            --text-muted: rgba(255,255,255,0.25);
            --text-faint: rgba(255,255,255,0.12);
            --border-color: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --nav-bg: rgba(13,13,26,0.92);
            --pagination-bg: rgba(13,13,26,0.85);
            --shadow-color: rgba(0,0,0,0.5);
            --overlay-bg: rgba(0,0,0,0.92);
            --card-bg: #1a1a2e;
            --input-bg: rgba(255,255,255,0.05);
            --input-border: rgba(255,255,255,0.06);
            --btn-hover: rgba(255,255,255,0.08);
            --scrollbar-thumb: rgba(255,255,255,0.15);
            --scrollbar-thumb-hover: rgba(255,255,255,0.25);
            --progress-bar: linear-gradient(90deg, #4fc3f7, #00e5ff);
            --accent-color: #4fc3f7;
            --accent-hover: rgba(79,195,247,0.2);
            --detail-panel-bg: #1a1a2e;
            --arrow-bg-hover: rgba(255,255,255,0.08);
            --arrow-color: rgba(255,255,255,0.2);
            --arrow-color-hover: rgba(255,255,255,0.8);
            --btn-bg: rgba(0,0,0,0.4);
            --btn-border: rgba(255,255,255,0.08);
            --btn-color: rgba(255,255,255,0.7);
            --btn-hover-bg: rgba(0,0,0,0.6);
            --btn-hover-color: rgba(255,255,255,0.9);
            --meta-color: rgba(255,255,255,0.7);
            --meta-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.4);
            --resolution-bg: #1a1a2e;
            --detail-panel-bg: #1a1a2e;
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0,0,0,0.5);
            --text-muted: rgba(0,0,0,0.25);
            --text-faint: rgba(0,0,0,0.1);
            --border-color: rgba(0,0,0,0.06);
            --border-hover: rgba(0,0,0,0.12);
            --nav-bg: rgba(255,255,255,0.92);
            --pagination-bg: rgba(255,255,255,0.85);
            --shadow-color: rgba(0,0,0,0.08);
            --overlay-bg: rgba(255,255,255,0.95);
            --card-bg: #ffffff;
            --input-bg: rgba(0,0,0,0.04);
            --input-border: rgba(0,0,0,0.08);
            --btn-hover: rgba(0,0,0,0.06);
            --scrollbar-thumb: rgba(0,0,0,0.15);
            --scrollbar-thumb-hover: rgba(0,0,0,0.25);
            --detail-panel-bg: #ffffff;
            --arrow-bg-hover: rgba(0,0,0,0.06);
            --arrow-color: rgba(0,0,0,0.15);
            --arrow-color-hover: rgba(0,0,0,0.5);
            --btn-bg: rgba(255,255,255,0.6);
            --btn-border: rgba(0,0,0,0.06);
            --btn-color: rgba(0,0,0,0.6);
            --btn-hover-bg: rgba(255,255,255,0.9);
            --btn-hover-color: rgba(0,0,0,0.85);
            --meta-color: rgba(0,0,0,0.7);
            --meta-shadow: 0 2px 20px rgba(255,255,255,0.9), 0 0 40px rgba(255,255,255,0.4);
            --resolution-bg: #ffffff;
            --detail-panel-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            background: var(--bg-primary); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden; 
            transition: background 0.3s ease, color 0.3s ease; 
            color: var(--text-primary); 
        }

        /* ===== 进度条 ===== */
        #progress-bar { position: fixed; top: 0; left: 0; height: 2.5px; background: var(--progress-bar); width: 0%; z-index: 9999; transition: width 0.3s ease; box-shadow: 0 0 12px rgba(79,195,247,0.4); }

        /* ===== 导航栏 ===== */
        .nav-toggle { position: fixed; top: 12px; left: 12px; z-index: 1001; background: var(--nav-bg); backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 20px; padding: 6px 12px; cursor: pointer; transition: 0.2s; line-height: 1; }
        .nav-toggle:hover { background: var(--accent-hover); border-color: rgba(79,195,247,0.2); }
        .nav-toggle.hidden { display: none !important; }
        .navbar { position: fixed; top: 12px; left: 56px; z-index: 1000; background: var(--nav-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 200px; opacity: 0; transform: translateY(-10px) scale(0.95); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; box-shadow: 0 8px 32px var(--shadow-color); max-width: 90vw; }
        .navbar.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .navbar-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .navbar .logo { color: var(--text-primary); font-size: 17px; font-weight: 300; display: flex; align-items: center; gap: 8px; }
        .navbar .logo span { color: var(--accent-color); font-weight: 600; }
        .navbar .badge { color: var(--text-secondary); font-size: 12px; }
        .navbar .search-box { display: flex; gap: 6px; width: 100%; }
        .navbar .search-box input { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 6px; padding: 5px 10px; color: var(--text-primary); font-size: 13px; outline: none; transition: 0.2s; }
        .navbar .search-box input:focus { border-color: var(--accent-color); }
        .navbar .search-box input::placeholder { color: var(--text-muted); }
        .navbar .search-box .search-btn { background: var(--accent-hover); border: none; color: var(--accent-color); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .navbar .search-box .search-btn:hover { background: rgba(79,195,247,0.25); color: var(--text-primary); }
        .navbar .nav-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .navbar .nav-actions a, .navbar .nav-actions button { background: var(--input-bg); border: none; color: var(--text-secondary); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .navbar .nav-actions a:hover, .navbar .nav-actions button:hover { background: var(--btn-hover); color: var(--text-primary); }
        #themeToggle { background: var(--accent-hover); color: var(--accent-color); border-radius: 50%; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; }
        #themeToggle:hover { background: rgba(79,195,247,0.3); color: var(--text-primary); }

        /* ===== 应用 ===== */
        .app { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            height: 100vh; 
            padding: 0; 
            overflow: hidden; 
            background: var(--bg-primary);
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 4px; 
            flex: 1;
            align-content: stretch;
            overflow-y: auto; 
            padding: 4px; 
            padding-bottom: 75px;
            scroll-behavior: smooth; 
            min-height: 0;
            background: var(--bg-primary);
        }

        .grid::-webkit-scrollbar { width: 6px; }
        .grid::-webkit-scrollbar-track { background: transparent; }
        .grid::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
        .grid::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

        /* ===== 卡片 ===== */
        .card {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            background: var(--bg-card);
            width: 100%;
            height: 100%;
            min-height: 0;
            cursor: pointer;
            transition: background 0.3s ease;
            aspect-ratio: 16 / 9;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        .card img.loaded { opacity: 1; }
        .card:hover img { transform: scale(1.06); }

        .card .placeholder-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.7);
            transform: scale(1.04);
            transition: opacity 0.6s ease;
            z-index: 1;
            background-color: #1a1a2e;
        }

        .card .placeholder-bg.hidden { opacity: 0; }

        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 16px 12px 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info { opacity: 1; }
        .card .info .date { font-size: 11px; color: rgba(255,255,255,0.4); }
        .card .info .title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .info .copyright { font-size: 12px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ===== 分页 - 浮动在底部上方 ===== */
        .pagination { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding: 8px 16px; 
            background: var(--pagination-bg); 
            backdrop-filter: blur(16px); 
            border: 1px solid var(--border-color);
            border-radius: 12px; 
            box-shadow: 0 4px 30px var(--shadow-color); 
            z-index: 100; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 95vw; 
            transition: background 0.3s ease, border-color 0.3s ease; 
            pointer-events: auto;
        }
        
        .pagination button { 
            background: var(--input-bg); 
            border: none; 
            color: var(--text-secondary); 
            padding: 6px 14px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            transition: 0.2s; 
            white-space: nowrap; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
        }
        .pagination button:hover:not(:disabled) { 
            background: var(--accent-hover); 
            color: var(--accent-color); 
        }
        .pagination button:disabled { 
            opacity: 0.2; 
            cursor: not-allowed; 
        }
        .pagination .page-info { 
            color: var(--text-secondary); 
            font-size: 13px; 
            white-space: nowrap; 
        }
        .pagination .total-info { 
            color: var(--text-muted); 
            font-size: 12px; 
            white-space: nowrap; 
        }
        .pagination .goto-box { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
        }
        .pagination .goto-box input { 
            width: 48px; 
            background: var(--input-bg); 
            border: 1px solid var(--input-border); 
            border-radius: 4px; 
            padding: 4px 6px; 
            color: var(--text-primary); 
            font-size: 13px; 
            text-align: center; 
            outline: none; 
            transition: 0.2s; 
        }
        .pagination .goto-box input:focus { 
            border-color: var(--accent-color); 
        }
        .pagination .goto-box .goto-btn { 
            background: var(--accent-hover); 
            border: none; 
            color: var(--accent-color); 
            padding: 4px 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 13px; 
            transition: 0.2s; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
        }
        .pagination .goto-box .goto-btn:hover { 
            background: rgba(79,195,247,0.3); 
            color: var(--text-primary); 
        }
        
        .empty { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-secondary); }
        .empty .icon { font-size: 40px; margin-bottom: 10px; }

        /* ============================================================
           大图预览
           ============================================================ */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .preview-overlay.active { display: flex; }

        .preview-overlay::before {
            content: '';
            position: fixed;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: center/cover no-repeat;
            filter: blur(30px) brightness(0.4);
            z-index: -1;
            transform: scale(1.1);
            transition: background-image 0.4s ease;
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .preview-image {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
            background: #0d0d1a;
            pointer-events: auto;
            cursor: pointer;
            z-index: 5;
            position: relative;
        }

        /* 顶部工具栏 */
        .toolbar {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: flex-end;
            transition: opacity 0.3s ease;
        }

        .toolbar .btn {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.75);
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
            text-decoration: none;
            position: relative;
        }

        .toolbar .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* ===== ★★★ 捐赠悬停二维码 - 长方形 ★★★ ===== */
        .donate-qr-wrapper {
            position: relative;
            display: inline-block;
        }

        .donate-qr-wrapper .qr-tooltip {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            transform: translateX(0);
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            z-index: 30;
            min-width: 320px;
        }

        .donate-qr-wrapper .qr-tooltip::before {
            content: '';
            position: absolute;
            bottom: 100%;
            right: 20px;
            border: 8px solid transparent;
            border-bottom-color: rgba(20, 20, 35, 0.95);
        }

        /* ★★★ 双码横向排列 ★★★ */
        .donate-qr-wrapper .qr-tooltip .qr-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }

        .donate-qr-wrapper .qr-tooltip .qr-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .donate-qr-wrapper .qr-tooltip .qr-item img {
            width: 130px;
            height: 130px;
            display: block;
            border-radius: 8px;
            background: #fff;
            padding: 4px;
        }

        .donate-qr-wrapper .qr-tooltip .qr-item .qr-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: 500;
        }

        .donate-qr-wrapper .qr-tooltip .qr-item .qr-label.wechat { color: #07c160; }
        .donate-qr-wrapper .qr-tooltip .qr-item .qr-label.alipay { color: #1677ff; }

        .donate-qr-wrapper .qr-tooltip .qr-footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .donate-qr-wrapper:hover .qr-tooltip {
            display: block;
        }

        /* 下载下拉菜单 */
        .dropdown { position: relative; display: inline-block; }
        .dropdown .btn { padding-right: 10px; }
        .dropdown .btn i.fa-chevron-down { font-size: 10px; margin-left: 4px; opacity: 0.5; }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: rgba(20, 20, 35, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 0;
            min-width: 140px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 20;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-menu a {
            display: block;
            padding: 8px 18px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 13px;
            transition: 0.15s;
            white-space: nowrap;
        }
        .dropdown-menu a:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .dropdown-menu .divider { height: 1px; background: rgba(255, 255, 255, 0.06); margin: 4px 12px; }

        .donate-modal { display: none !important; }

        /* 左右箭头 */
        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 32px;
            padding: 20px 14px;
            cursor: pointer;
            transition: 0.25s ease;
            border-radius: 8px;
            z-index: 10;
        }
        .arrow:hover { color: #fff; background: rgba(0, 0, 0, 0.5); }
        .arrow-left { left: 16px; }
        .arrow-right { right: 16px; }

        /* 底部信息 */
        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .info-panel .copyright { font-size: 15px; color: rgba(255, 255, 255, 0.85); line-height: 1.5; }
        .info-panel .date { font-size: 13px; color: rgba(255, 255, 255, 0.4); margin-top: 4px; }
        .info-panel .desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            max-width: 600px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.6;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 1000px) { .grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 800px) {
            .grid { grid-template-columns: repeat(4, 1fr); padding-bottom: 70px; }
            .navbar { left: 52px; min-width: 160px; padding: 12px 14px; top: 10px; }
            .nav-toggle { font-size: 18px; padding: 5px 10px; top: 10px; left: 10px; }
            .pagination { padding: 6px 12px; gap: 6px; bottom: 14px; border-radius: 10px; }
            .pagination button { font-size: 12px; padding: 4px 10px; }
            .pagination .page-info { font-size: 12px; }
            .pagination .goto-box input { width: 40px; font-size: 12px; }
            .arrow { font-size: 22px; padding: 14px 10px; }
            .arrow-left { left: 4px; }
            .arrow-right { right: 4px; }
            .toolbar { top: 10px; right: 10px; gap: 4px; }
            .toolbar .btn { font-size: 11px; padding: 5px 10px; }
            .info-panel .copyright { font-size: 13px; }
            .info-panel .desc { font-size: 12px; -webkit-line-clamp: 1; }
            .donate-qr-wrapper .qr-tooltip { min-width: 260px; padding: 10px 12px; }
            .donate-qr-wrapper .qr-tooltip .qr-item img { width: 110px; height: 110px; }
            .donate-qr-wrapper .qr-tooltip .qr-row { gap: 12px; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); padding-bottom: 65px; }
            .pagination { padding: 5px 10px; gap: 4px; bottom: 10px; border-radius: 8px; }
            .donate-qr-wrapper .qr-tooltip { min-width: 220px; padding: 8px 10px; }
            .donate-qr-wrapper .qr-tooltip .qr-item img { width: 90px; height: 90px; }
            .donate-qr-wrapper .qr-tooltip .qr-row { gap: 10px; }
            .donate-qr-wrapper .qr-tooltip .qr-item .qr-label { font-size: 10px; }
        }
        @media (max-width: 400px) {
            .grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 2px; 
                padding: 2px; 
                padding-bottom: 60px;
            }
            .card { aspect-ratio: 16 / 10; border-radius: 0; }
            .card .info .title { font-size: 12px; }
            .card .info .copyright { font-size: 10px; }
            .card .info .date { font-size: 10px; }
            .navbar { left: 48px; min-width: 140px; padding: 10px 12px; top: 8px; }

            .navbar .search-box input { font-size: 12px; padding: 4px 8px; }

<body>

    <!-- ===== 进度条 ===== -->
    <div id="progress-bar"></div>

    <!-- ===== 导航栏 ===== -->
    <button class="nav-toggle" id="navToggle" aria-label="切换导航"><i class="fas fa-bars"></i></button>
    <div class="navbar" id="navbar">
        <div class="navbar-header"><div class="logo"><img src="/favicon.ico" alt="Logo" style="width:24px;height:24px;border-radius:4px;" /> Bing <span>Wallpaper</span></div></div>
        <div class="badge"><i class="fas fa-images"></i> <span id="totalNavCount">0</span> 张</div>
        <div class="search-box"><input type="text" id="searchInput" placeholder="搜索年份/关键词..." /><button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button></div>
        <div class="nav-actions"><button id="homeBtn"><i class="fas fa-home"></i> 首页</button><a href="/api" target="_blank"><i class="fas fa-code"></i> API</a><a href="https://aoso.hangdn.com" target="_blank" rel="noopener"><i class="fas fa-blog"></i> 博客</a><button id="themeToggle"><i class="fas fa-moon"></i></button></div>
    </div>

    <!-- ===== 应用 ===== -->
    <div class="app"><div class="grid" id="grid"></div></div>

    <!-- ===== 分页 ===== -->
    <div class="pagination" id="pagination">
        <button id="prevBtn" disabled><i class="fas fa-chevron-left"></i> 上一页</button>
        <span class="page-info" id="pageInfo">第 1 / 1 页</span>
        <span class="total-info" id="totalInfo"><i class="fas fa-images"></i> 共 0 张</span>
        <button id="nextBtn">下一页 <i class="fas fa-chevron-right"></i></button>
        <div class="goto-box"><input type="number" id="gotoInput" min="1" placeholder="页" /><button class="goto-btn" id="gotoBtn"><i class="fas fa-arrow-right"></i> 跳转</button></div>
    </div>

    <!-- ============================================================
    大图预览
    ============================================================ -->
    <div class="preview-overlay" id="previewOverlay">
        <button class="arrow arrow-left" id="prevPreviewBtn"><i class="fas fa-chevron-left"></i></button>
        <button class="arrow arrow-right" id="nextPreviewBtn"><i class="fas fa-chevron-right"></i></button>

        <div class="preview-container">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>

        <!-- 工具栏 -->
        <div class="toolbar" id="toolbar">
            <a href="/" class="btn" title="返回首页"><i class="fas fa-home"></i> <span>首页</span></a>

            <div class="dropdown" id="downloadDropdown">
                <button class="btn" id="downloadBtn"><i class="fas fa-download"></i> <span>下载</span> <i class="fas fa-chevron-down"></i></button>
                <div class="dropdown-menu" id="downloadMenu">
                    <a href="#" data-res="4k">4K (3840×2160)</a>
                    <a href="#" data-res="fhd">全高清 (1920×1080)</a>
                    <a href="#" data-res="hd">高清 (1366×768)</a>
                    <div class="divider"></div>
                    <a href="#" data-res="mobile">手机 (1080×1920)</a>
                </div>
            </div>

            <!-- ===== ★★★ 捐赠 - 双码横向长方形 ★★★ ===== -->
            <div class="donate-qr-wrapper">
                <button class="btn" id="donateBtn"><i class="fas fa-heart" style="color:#ff6b6b;"></i> <span>捐赠</span></button>
                <div class="qr-tooltip">
                    <div class="qr-row">
                        <div class="qr-item">
                            <img src="https://img.hangdn.com/hd/wx_alipay.png" alt="微信支付" />
                            <span class="qr-label wechat"><i class="fab fa-weixin"></i> 微信支付</span>
                        </div>
                        <div class="qr-item">
                            <img src="https://img.hangdn.com/hd/wx_alipay.png" alt="支付宝" />
                            <span class="qr-label alipay"><i class="fab fa-alipay"></i> 支付宝</span>
                        </div>
                    </div>
                    <div class="qr-footer">❤️ 您的支持是我持续更新的动力</div>
                </div>
            </div>

            <button class="btn" id="closePreviewBtn"><i class="fas fa-times"></i></button>
        </div>

        <!-- 底部信息 -->
        <div class="info-panel" id="infoPanel">
            <div class="copyright" id="previewCopyright"></div>
            <div class="date" id="previewDate"></div>
            <div class="desc" id="previewDesc"></div>
        </div>
    </div>

    <!-- ===== 捐赠浮窗（已废弃） ===== -->
    <div class="donate-modal" id="donateModal">
        <div class="donate-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://bing.ee123.net/donate" alt="捐赠二维码" />
            <p>扫码支持本站<br /><span style="font-size:12px;opacity:0.5;">您的支持是我持续更新的动力 ❤️</span></p>
            <button class="close-donate" id="closeDonate">关闭</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            var path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        var BASE_PATH = getBasePath();

        function getImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/')) return BASE_PATH + url;
            return url;
        }

        function getThumbnailUrl(url) {
            if (!url) return '';
            if (url.indexOf('th?id=') !== -1) {
                var baseUrl = url.split('&')[0];
                if (baseUrl.indexOf('_UHD.jpg') !== -1) {
                    baseUrl = baseUrl.replace('_UHD.jpg', '_1920x1080.jpg');
                }
                if (baseUrl.indexOf('_400x240.jpg') !== -1) {
                    return baseUrl;
                }
                return baseUrl + '&w=800&h=450';
            }
            return url;
        }

        // ============================================================
        // 2. 主题切换
        // ============================================================
        var themeToggle = document.getElementById('themeToggle');
        var currentTheme = localStorage.getItem('theme') || 'dark';

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.innerHTML = theme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        }
        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });
        setTheme(currentTheme);

        // ============================================================
        // 3. 进度条
        // ============================================================
        var progressBar = document.getElementById('progress-bar');

        function showProgress() {
            progressBar.style.width = '30%';
            setTimeout(function() { progressBar.style.width = '60%'; }, 150);
        }

        function hideProgress() {
            progressBar.style.width = '100%';
            setTimeout(function() { progressBar.style.width = '0%'; }, 350);
        }

        // ============================================================
        // 4. 导航栏
        // ============================================================
        var navToggle = document.getElementById('navToggle');
        var navbar = document.getElementById('navbar');
        var navOpen = false;

        function toggleNav(open) {
            navOpen = open !== undefined ? open : !navOpen;
            navbar.classList.toggle('open', navOpen);
            navToggle.innerHTML = navOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
        }

        navToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleNav();
        });
        document.addEventListener('click', function(e) {
            if (navOpen && !navbar.contains(e.target) && e.target !== navToggle) {
                toggleNav(false);
            }
        });

        // ============================================================
        // 5. 数据加载
        // ============================================================
        var allData = [];
        var filteredData = [];
        var currentPage = 1;
        var PAGE_SIZE = 30;
        var totalPages = 1;
        var currentPreviewIndex = 0;
        var currentPreviewItem = null;

        var grid = document.getElementById('grid');
        var previewOverlay = document.getElementById('previewOverlay');
        var previewImg = document.getElementById('previewImg');
        var previewCopyright = document.getElementById('previewCopyright');
        var previewDate = document.getElementById('previewDate');
        var previewDesc = document.getElementById('previewDesc');
        var totalNavCount = document.getElementById('totalNavCount');
        var searchInput = document.getElementById('searchInput');
        var searchBtn = document.getElementById('searchBtn');
        var homeBtn = document.getElementById('homeBtn');
        var prevBtn = document.getElementById('prevBtn');
        var nextBtn = document.getElementById('nextBtn');
        var pageInfo = document.getElementById('pageInfo');
        var totalInfo = document.getElementById('totalInfo');
        var gotoInput = document.getElementById('gotoInput');
        var gotoBtn = document.getElementById('gotoBtn');
        var closePreviewBtn = document.getElementById('closePreviewBtn');
        var donateBtn = document.getElementById('donateBtn');
        var donateModal = document.getElementById('donateModal');
        var closeDonate = document.getElementById('closeDonate');
        var downloadBtn = document.getElementById('downloadBtn');
        var downloadMenu = document.getElementById('downloadMenu');

        // 缩放状态
        var scale = 1,
            minScale = 0.3,
            maxScale = 5,
            translateX = 0,
            translateY = 0,
            isDragging = false,
            startX = 0,
            startY = 0,
            lastTranslateX = 0,
            lastTranslateY = 0;

        // 工具栏显示状态
        var toolbarVisible = true;

        // ============================================================
        // 5.1 加载数据
        // ============================================================
        async function loadData() {
            showProgress();
            try {
                var url = BASE_PATH + '/data/wallpapers.json';
                var res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    hideProgress();
                    return;
                }
                allData.sort(function(a, b) { return b.date.localeCompare(a.date); });
                filteredData = [];
                totalNavCount.textContent = allData.length;
                totalInfo.innerHTML = '<i class="fas fa-images"></i> 共 ' + allData.length + ' 张';
                currentPage = 1;
                renderPage(1);
                hideProgress();
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
                hideProgress();
            }
        }

        // ============================================================
        // 5.2 渲染页面
        // ============================================================
        function renderPage(page) {
            var data = filteredData.length > 0 ? filteredData : allData;
            totalPages = Math.ceil(data.length / PAGE_SIZE);
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            if (totalPages === 0) { showEmpty(); return; }
            currentPage = page;
            var start = (page - 1) * PAGE_SIZE;
            var end = Math.min(start + PAGE_SIZE, data.length);
            var items = data.slice(start, end);
            grid.innerHTML = '';
            if (items.length === 0) { showEmpty(); return; }

            items.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'card';

                var imgSrc = getImageUrl(item.webp || item.jpg || '');
                var fallback = getImageUrl(item.jpg || '');
                var placeholderSrc = getThumbnailUrl(imgSrc);

                card.innerHTML =
                    '<div class="placeholder-bg" style="background-image: url(' + placeholderSrc + ');"></div>' +
                    '<img src="' + imgSrc + '" alt="' + (item.copyright || item.date) + '" loading="lazy" />' +
                    '<div class="info">' +
                    '<div class="date">' + item.date + '</div>' +
                    '<div class="title">' + (item.copyright || '无标题') + '</div>' +
                    '<div class="copyright">' + (item.copyright || '') + '</div>' +
                    '</div>';

                var img = card.querySelector('img');
                var placeholderBg = card.querySelector('.placeholder-bg');

                img.addEventListener('load', function() {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                });
                if (img.complete) {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                }
                img.addEventListener('error', function() {
                    if (fallback && fallback !== imgSrc) {
                        img.src = fallback;
                    } else {
                        img.classList.add('loaded');
                        placeholderBg.classList.add('hidden');
                    }
                });

                card.addEventListener('click', function() {
                    var targetIndex = -1;
                    for (var i = 0; i < allData.length; i++) {
                        if (allData[i].date === item.date) {
                            targetIndex = i;
                            break;
                        }
                    }
                    if (targetIndex === -1) return;
                    openPreview(targetIndex);
                });

                grid.appendChild(card);
            });

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            pageInfo.textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页';
            gotoInput.max = totalPages;
            gotoInput.placeholder = '1-' + totalPages;
            grid.scrollTop = 0;
        }

        // ============================================================
        // 5.3 分页事件
        // ============================================================
        prevBtn.addEventListener('click', function() { if (currentPage > 1) renderPage(currentPage - 1); });
        nextBtn.addEventListener('click', function() { if (currentPage < totalPages) renderPage(currentPage + 1); });
        gotoBtn.addEventListener('click', function() {
            var val = parseInt(gotoInput.value);
            if (!isNaN(val) && val >= 1 && val <= totalPages) renderPage(val);
            gotoInput.value = '';
        });
        gotoInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') gotoBtn.click(); });

        // ============================================================
        // 5.4 搜索
        // ============================================================
        function doSearch() {
            var keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) { filteredData = [];
                renderPage(1); return; }
            filteredData = allData.filter(function(item) {
                var copyright = (item.copyright || '').toLowerCase();
                var date = item.date || '';
                var dateClean = date.replace(/-/g, '');
                return copyright.indexOf(keyword) !== -1 || date.indexOf(keyword) !== -1 || dateClean.indexOf(keyword) !== -1;
            });
            if (filteredData.length === 0) {
                grid.innerHTML =
                    '<div class="empty"><div class="icon"><i class="fas fa-search"></i></div><div>没有匹配"' + keyword +
                    '"的壁纸</div></div>';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pageInfo.textContent = '第 0 / 0 页';
                return;
            }
            renderPage(1);
        }
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSearch(); });
        homeBtn.addEventListener('click', function() {
            searchInput.value = '';
            filteredData = [];
            renderPage(1);
            toggleNav(false);
        });

        // ============================================================
        // 5.5 空状态
        // ============================================================
        function showEmpty() {
            grid.innerHTML =
                '<div class="empty"><div class="icon"><i class="fas fa-image"></i></div><div>暂无壁纸数据</div></div>';
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '第 0 / 0 页';
            totalInfo.innerHTML = '<i class="fas fa-images"></i> 共 0 张';
            totalNavCount.textContent = '0';
        }

        // ============================================================
        // 6. 大图预览
        // ============================================================

        function openPreview(index) {
            if (!allData || allData.length === 0) return;
            if (index < 0) index = 0;
            if (index >= allData.length) index = allData.length - 1;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];
            resetZoom();
            showPreview(currentPreviewIndex);
            previewOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            var imgSrc = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewOverlay.style.setProperty('--bg-url', 'url(' + imgSrc + ')');

            navToggle.classList.add('hidden');
            showToolbar();

            previewImg.onclick = function(e) {
                e.stopPropagation();
                toggleToolbar();
            };
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];

            var imgSrc = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewImg.src = imgSrc;
            previewCopyright.textContent = currentPreviewItem.copyright || '';
            previewDate.textContent = currentPreviewItem.date || '';
            previewDesc.textContent = currentPreviewItem.description || '';
            previewOverlay.style.setProperty('--bg-url', 'url(' + imgSrc + ')');
            resetZoom();
        }

        function closePreview() {
            previewOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            navToggle.classList.remove('hidden');
            showToolbar();
        }

        function toggleToolbar() {
            toolbarVisible = !toolbarVisible;
            var arrows = document.querySelectorAll('.arrow');
            for (var i = 0; i < arrows.length; i++) {
                arrows[i].style.transition = 'opacity 0.3s ease';
                arrows[i].style.opacity = toolbarVisible ? '1' : '0';
                arrows[i].style.pointerEvents = toolbarVisible ? '' : 'none';
            }
            var toolbars = document.querySelectorAll('.toolbar');
            for (var i = 0; i < toolbars.length; i++) {
                toolbars[i].style.transition = 'opacity 0.3s ease';
                toolbars[i].style.opacity = toolbarVisible ? '1' : '0';
                toolbars[i].style.pointerEvents = toolbarVisible ? '' : 'none';
            }
            var infoPanels = document.querySelectorAll('.info-panel');
            for (var i = 0; i < infoPanels.length; i++) {
                infoPanels[i].style.transition = 'opacity 0.3s ease';
                infoPanels[i].style.opacity = toolbarVisible ? '1' : '0';
                infoPanels[i].style.pointerEvents = toolbarVisible ? '' : 'none';
            }
        }

        function showToolbar() {
            toolbarVisible = true;
            var allElements = document.querySelectorAll('.arrow, .toolbar, .info-panel');
            for (var i = 0; i < allElements.length; i++) {
                allElements[i].style.transition = 'opacity 0.3s ease';
                allElements[i].style.opacity = '1';
                allElements[i].style.pointerEvents = '';
            }
        }

        document.getElementById('prevPreviewBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
            showToolbar();
        });
        document.getElementById('nextPreviewBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
            showToolbar();
        });

        document.addEventListener('keydown', function(e) {
            if (!previewOverlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') {
                showPreview(currentPreviewIndex - 1);
                showToolbar();
            }
            if (e.key === 'ArrowRight') {
                showPreview(currentPreviewIndex + 1);
                showToolbar();
            }
        });

        previewOverlay.addEventListener('click', function(e) {
            if (e.target === previewOverlay) closePreview();
        });

        closePreviewBtn.addEventListener('click', closePreview);

        // ============================================================
        // 6.1 下载下拉菜单
        // ============================================================
        downloadBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            downloadMenu.classList.toggle('show');
        });

        downloadMenu.querySelectorAll('a').forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var res = this.getAttribute('data-res');
                downloadImage(currentPreviewIndex, res);
                downloadMenu.classList.remove('show');
            });
        });

        document.addEventListener('click', function() {
            downloadMenu.classList.remove('show');
        });

        function downloadImage(index, resolution) {
            if (!allData || allData.length === 0) return;
            var item = allData[index];
            if (!item) return;
            var url = getImageUrl(item.jpg || item.webp || '');
            var resolutions = {
                '4k': { w: 3840, h: 2160 },
                'fhd': { w: 1920, h: 1080 },
                'hd': { w: 1366, h: 768 },
                'mobile': { w: 1080, h: 1920 }
            };
            var res = resolutions[resolution] || resolutions['fhd'];
            var downloadUrl = url;
            if (url.indexOf('th?id=') !== -1) {
                var baseUrl = url.split('&')[0];
                downloadUrl = baseUrl + '&w=' + res.w + '&h=' + res.h;
            }
            var a = document.createElement('a');
            a.href = downloadUrl;
            var fileName = 'wallpaper_' + (item.date || '') + '_' + resolution + '.jpg';
            a.download = fileName;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            console.log('📥 下载: ' + fileName + ' (' + resolution + ')');
        }

        // ============================================================
        // 7. 缩放
        // ============================================================
        var imageContainer = previewImg;

        function updateTransform() {
            previewImg.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')';
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }

        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            var pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            var pos = e.type === 'mousemove' ? e : e.touches[0];
            translateX = lastTranslateX + pos.clientX - startX;
            translateY = lastTranslateY + pos.clientY - startY;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        function wheelZoom(e) {
            e.preventDefault();
            var delta = e.deltaY > 0 ? -0.15 : 0.15;
            scale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (scale <= 1) { translateX = 0;
                translateY = 0; }
            updateTransform();
        }

        previewImg.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);
        previewImg.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });
        previewImg.addEventListener('wheel', wheelZoom, { passive: false });

        // ============================================================
        // 8. 启动
        // ============================================================
        loadData();
        console.log('✅ 大图预览已加载');
        console.log('💡 捐赠悬停显示双码长方形');
    </script>
