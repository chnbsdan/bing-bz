<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ===== 顶部浮动导航（左上角，默认隐藏） ===== */
        .navbar {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: rgba(13, 13, 26, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .navbar.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* 触发区域：左上角一小块不可见区域，鼠标经过时显示导航 */
        .navbar-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 120px;
            height: 80px;
            z-index: 999;
            cursor: default;
        }

        .navbar .logo {
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .navbar .logo span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .navbar .badge {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            white-space: nowrap;
        }

        .navbar .badge span {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ===== 应用容器 ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }

        /* ===== 网格：7列 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            flex: 1;
            align-content: start;
            overflow: hidden;
        }

        .card {
            position: relative;
            aspect-ratio: 16 / 11;
            background: #1a1a2e;
            overflow: hidden;
            cursor: pointer;
            border-radius: 4px;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 8px 6px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info {
            opacity: 1;
        }

        .card .info .date {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
        }

        .card .info .title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .copyright {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 分页控制栏 ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 10px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #e0e0e0;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            min-width: 80px;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(79, 195, 247, 0.25);
            color: #4fc3f7;
        }

        .pagination button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            min-width: 120px;
            text-align: center;
        }

        .pagination .total-info {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }

        /* ===== 空状态 ===== */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* ============================================================
           全屏预览遮罩
           ============================================================ */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            overflow: hidden;
            user-select: none;
        }

        .overlay.active {
            display: block;
        }

        .overlay .close {
            position: fixed;
            top: 20px;
            right: 28px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 36px;
            cursor: pointer;
            z-index: 100;
            font-family: serif;
            line-height: 1;
            transition: 0.2s;
        }

        .overlay .close:hover {
            color: #fff;
        }

        /* ===== 预览底部操作按钮 ===== */
        .overlay .action-buttons {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        .overlay .action-buttons a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 18px;
            border-radius: 6px;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .overlay .action-buttons a:hover {
            background: rgba(79, 195, 247, 0.2);
            color: #4fc3f7;
            border-color: rgba(79, 195, 247, 0.3);
        }

        .overlay .action-buttons .btn-download {
            background: rgba(79, 195, 247, 0.15);
            color: #4fc3f7;
            border-color: rgba(79, 195, 247, 0.2);
        }

        .overlay .action-buttons .btn-download:hover {
            background: rgba(79, 195, 247, 0.3);
            color: #fff;
        }

        .overlay .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
        }

        .overlay .image-container:active {
            cursor: grabbing;
        }

        .overlay .preview-image {
            display: block;
            max-width: none;
            max-height: none;
            pointer-events: none;
            transform-origin: center center;
            transition: none;
            will-change: transform;
            width: auto;
            height: auto;
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .overlay .meta {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            max-width: 80%;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 50;
        }

        .overlay .meta .date {
            font-size: 11px;
            opacity: 0.5;
            display: block;
        }

        .overlay .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 48px;
            cursor: pointer;
            padding: 20px 12px;
            z-index: 50;
            font-family: serif;
            line-height: 1;
            user-select: none;
            transition: 0.2s;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .overlay .arrow:hover {
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
        }

        .overlay .arrow-left {
            left: 10px;
        }

        .overlay .arrow-right {
            right: 10px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .navbar {
                padding: 6px 12px;
                gap: 8px;
            }
            .navbar .logo {
                font-size: 15px;
            }
            .navbar .badge {
                font-size: 10px;
            }
            .navbar-trigger {
                width: 80px;
                height: 60px;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
            }
            .card {
                aspect-ratio: 16 / 12;
            }
            .pagination {
                gap: 8px;
                flex-wrap: wrap;
            }
            .pagination button {
                padding: 6px 12px;
                font-size: 12px;
                min-width: 60px;
            }
            .pagination .page-info {
                font-size: 12px;
                min-width: 80px;
            }
            .overlay .arrow {
                font-size: 28px;
                padding: 10px 4px;
            }
            .overlay .arrow-left {
                left: 2px;
            }
            .overlay .arrow-right {
                right: 2px;
            }
            .overlay .close {
                font-size: 28px;
                top: 12px;
                right: 16px;
            }
            .overlay .action-buttons {
                bottom: 70px;
                padding: 6px 12px;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .overlay .action-buttons a {
                font-size: 12px;
                padding: 4px 12px;
            }
            .overlay .meta {
                font-size: 11px;
                padding: 4px 12px;
                bottom: 130px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 左上角浮动导航栏（默认隐藏，鼠标经过左上角出现） ===== -->
    <div class="navbar-trigger" id="navbarTrigger"></div>
    <div class="navbar" id="navbar">
        <div class="logo">Bing <span>Wallpaper</span></div>
        <div class="badge"><span id="totalNavCount">0</span> 张</div>
    </div>

    <!-- ===== 应用容器 ===== -->
    <div class="app">
        <!-- ===== 图片网格 ===== -->
        <div class="grid" id="grid"></div>

        <!-- ===== 分页控制栏 ===== -->
        <div class="pagination">
            <button id="prevBtn" disabled>‹ 上一页</button>
            <span class="page-info" id="pageInfo">第 1 / 1 页</span>
            <span class="total-info" id="totalInfo">共 0 张</span>
            <button id="nextBtn">下一页 ›</button>
        </div>
    </div>

    <!-- ===== 全屏预览遮罩 ===== -->
    <div class="overlay" id="overlay">
        <span class="close" id="closeBtn">&times;</span>
        <span class="arrow arrow-left" id="prevPreviewBtn">‹</span>
        <span class="arrow arrow-right" id="nextPreviewBtn">›</span>

        <div class="image-container" id="imageContainer">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>

        <!-- ===== 底部操作按钮（打开链接 + 下载4K） ===== -->
        <div class="action-buttons">
            <a href="#" id="openLinkBtn" target="_blank" rel="noopener">🔗 打开链接</a>
            <a href="#" id="downloadBtn" class="btn-download" download>⬇️ 下载4K图片</a>
        </div>

        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        function fixImagePath(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/bing-img/')) return url;
            if (url.startsWith('/')) {
                return `${BASE_PATH}${url}`;
            }
            return url;
        }

        // ============================================================
        // 2. 导航栏：鼠标经过左上角区域显示
        // ============================================================
        const navbar = document.getElementById('navbar');
        const navbarTrigger = document.getElementById('navbarTrigger');

        navbarTrigger.addEventListener('mouseenter', () => {
            navbar.classList.add('show');
        });

        navbar.addEventListener('mouseleave', () => {
            navbar.classList.remove('show');
        });

        // 鼠标离开触发区域和导航栏时隐藏（如果鼠标进入导航栏则保持显示）
        let navTimeout = null;
        navbarTrigger.addEventListener('mouseleave', () => {
            navTimeout = setTimeout(() => {
                if (!navbar.matches(':hover')) {
                    navbar.classList.remove('show');
                }
            }, 200);
        });

        navbar.addEventListener('mouseenter', () => {
            clearTimeout(navTimeout);
        });

        // ============================================================
        // 3. 数据 + 分页
        // ============================================================
        let allData = [];
        let currentPage = 0;
        const PAGE_SIZE = 42;
        let currentPreviewIndex = 0;
        let currentPreviewItem = null; // 保存当前预览的图片数据，用于下载和打开链接

        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const imageContainer = document.getElementById('imageContainer');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewDate = document.getElementById('previewDate');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const totalInfo = document.getElementById('totalInfo');
        const totalNavCount = document.getElementById('totalNavCount');
        const openLinkBtn = document.getElementById('openLinkBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        // 缩放状态
        let scale = 1;
        let minScale = 0.3;
        let maxScale = 5;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let lastTranslateX = 0;
        let lastTranslateY = 0;

        // ===== 加载数据 =====
        async function loadData() {
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    return;
                }
                allData.sort((a, b) => b.date.localeCompare(a.date));
                totalInfo.textContent = `共 ${allData.length} 张`;
                totalNavCount.textContent = allData.length;
                currentPage = 0;
                renderPage(0);
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
            }
        }

        // ===== 渲染指定页 =====
        function renderPage(page) {
            const totalPages = Math.ceil(allData.length / PAGE_SIZE);
            if (page < 0) page = 0;
            if (page >= totalPages) page = totalPages - 1;
            if (page < 0 || totalPages === 0) return;

            currentPage = page;
            const start = page * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allData.length);
            const slice = allData.slice(start, end);

            grid.innerHTML = '';

            if (slice.length === 0) {
                showEmpty();
                return;
            }

            slice.forEach((item, index) => {
                const realIndex = start + index;
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = fixImagePath(item.webp || item.jpg || '');
                const fallback = fixImagePath(item.jpg || '');

                card.innerHTML = `
                    <img src="${imgSrc}" alt="${item.copyright || item.date}" loading="lazy" 
                         onerror="this.src='${fallback}'" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openPreview(realIndex);
                });

                grid.appendChild(card);
            });

            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= totalPages - 1;
            pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 页`;
        }

        // ===== 分页按钮事件 =====
        prevBtn.addEventListener('click', () => {
            if (currentPage > 0) renderPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(allData.length / PAGE_SIZE);
            if (currentPage < totalPages - 1) renderPage(currentPage + 1);
        });

        // ===== 空状态 =====
        function showEmpty() {
            grid.innerHTML = `
                <div class="empty">
                    <div class="icon">🖼️</div>
                    <div>暂无壁纸数据</div>
                </div>
            `;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '第 0 / 0 页';
            totalInfo.textContent = '共 0 张';
            totalNavCount.textContent = '0';
        }

        // ============================================================
        // 4. 全屏预览
        // ============================================================
        function openPreview(index) {
            if (allData.length === 0) return;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];
            resetZoom();
            showPreview(currentPreviewIndex);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateActionButtons();
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];

            const imgSrc = fixImagePath(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewImg.src = imgSrc;
            previewTitle.textContent = currentPreviewItem.title || currentPreviewItem.copyright || '';
            previewDate.textContent = currentPreviewItem.date || '';
            updateActionButtons();
            resetZoom();
        }

        function updateActionButtons() {
            if (!currentPreviewItem) return;
            const url = currentPreviewItem.jpg || currentPreviewItem.webp || '';
            const fullUrl = fixImagePath(url);
            // 打开链接：用图片的完整URL
            openLinkBtn.href = fullUrl;
            openLinkBtn.target = '_blank';
            // 下载链接
            downloadBtn.href = fullUrl;
            // 提取文件名
            const fileName = fullUrl.split('/').pop().split('?')[0] || 'wallpaper.jpg';
            downloadBtn.download = fileName;
        }

        function closePreview() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== 缩放 =====
        function updateTransform() {
            previewImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            previewImg.style.width = 'auto';
            previewImg.style.height = 'auto';
            previewImg.style.maxWidth = '95vw';
            previewImg.style.maxHeight = '85vh';
            updateTransform();
        }

        // ===== 拖拽 =====
        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            const pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = e.type === 'mousemove' ? e : e.touches[0];
            const dx = pos.clientX - startX;
            const dy = pos.clientY - startY;
            translateX = lastTranslateX + dx;
            translateY = lastTranslateY + dy;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        // ===== 滚轮缩放 =====
        function wheelZoom(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (newScale > 1) {
                previewImg.style.maxWidth = 'none';
                previewImg.style.maxHeight = 'none';
            } else {
                previewImg.style.maxWidth = '95vw';
                previewImg.style.maxHeight = '85vh';
                translateX = 0;
                translateY = 0;
            }
            scale = newScale;
            updateTransform();
        }

        // ============================================================
        // 5. 事件绑定
        // ============================================================
        document.getElementById('closeBtn').addEventListener('click', closePreview);
        document.getElementById('prevPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
        });
        document.getElementById('nextPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
        });

        imageContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);

        imageContainer.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });

        imageContainer.addEventListener('wheel', wheelZoom, { passive: false });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePreview();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') showPreview(currentPreviewIndex - 1);
            if (e.key === 'ArrowRight') showPreview(currentPreviewIndex + 1);
        });

        // ============================================================
        // 6. 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
