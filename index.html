<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* ===== 网格：7列，完全无间隙 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            align-content: start;
        }

        /* ===== 每个卡片 ===== */
        .card {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #0d0d1a;
            overflow: hidden;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== 悬停信息浮层 ===== */
        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 10px 8px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info {
            opacity: 1;
        }

        .card .info .date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        .card .info .title {
            font-size: 13px;
            font-weight: 500;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .copyright {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 第一个卡片：网站标识 ===== */
        .card.featured {
            background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 16px;
            cursor: default;
        }

        .card.featured:hover .info {
            opacity: 0;
        }

        .card.featured .logo {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .card.featured .logo span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .card.featured .sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 4px;
            letter-spacing: 4px;
        }

        /* ===== 空状态 ===== */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* ============================================================
           全屏预览遮罩（缩放版）
           ============================================================ */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            overflow: hidden;
            user-select: none;
        }

        .overlay.active {
            display: block;
        }

        /* ===== 关闭按钮 ===== */
        .overlay .close {
            position: fixed;
            top: 20px;
            right: 28px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 36px;
            cursor: pointer;
            z-index: 100;
            font-family: serif;
            line-height: 1;
            transition: 0.2s;
        }

        .overlay .close:hover {
            color: #fff;
        }

        /* ===== 缩放控制按钮 ===== */
        .overlay .zoom-controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
        }

        .overlay .zoom-controls button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 4px;
            transition: 0.2s;
            font-family: serif;
            line-height: 1;
        }

        .overlay .zoom-controls button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .overlay .zoom-controls .zoom-level {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            min-width: 44px;
            text-align: center;
            line-height: 32px;
            font-family: sans-serif;
        }

        /* ===== 图片容器 ===== */
        .overlay .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
        }

        .overlay .image-container:active {
            cursor: grabbing;
        }

        .overlay .preview-image {
            display: block;
            max-width: none;
            max-height: none;
            pointer-events: none;
            transform-origin: center center;
            transition: none;
            will-change: transform;
            /* 初始适应屏幕 */
            width: auto;
            height: auto;
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        /* ===== 大图底部信息 ===== */
        .overlay .meta {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            max-width: 80%;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 50;
        }

        .overlay .meta .date {
            font-size: 11px;
            opacity: 0.5;
            display: block;
        }

        /* ===== 左右箭头 ===== */
        .overlay .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 48px;
            cursor: pointer;
            padding: 20px 12px;
            z-index: 50;
            font-family: serif;
            line-height: 1;
            user-select: none;
            transition: 0.2s;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .overlay .arrow:hover {
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
        }

        .overlay .arrow-left {
            left: 10px;
        }

        .overlay .arrow-right {
            right: 10px;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .card.featured .logo {
                font-size: 18px;
            }
            .card.featured .sub {
                font-size: 9px;
            }
            .overlay .arrow {
                font-size: 28px;
                padding: 10px 4px;
            }
            .overlay .arrow-left {
                left: 2px;
            }
            .overlay .arrow-right {
                right: 2px;
            }
            .overlay .close {
                font-size: 28px;
                top: 12px;
                right: 16px;
            }
            .overlay .zoom-controls {
                bottom: 70px;
                padding: 4px 12px;
                gap: 6px;
            }
            .overlay .zoom-controls button {
                font-size: 18px;
                padding: 2px 8px;
            }
            .overlay .meta {
                font-size: 11px;
                padding: 4px 12px;
                bottom: 20px;
            }
        }

        /* 滚动条美化 */
        .grid::-webkit-scrollbar {
            width: 4px;
        }
        .grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== 图片网格 ===== -->
    <div class="grid" id="grid">
        <div class="card featured">
            <div class="logo">Bing <span>Wallpaper</span></div>
            <div class="sub">每日精选</div>
        </div>
    </div>

    <!-- ===== 全屏预览遮罩 ===== -->
    <div class="overlay" id="overlay">
        <span class="close" id="closeBtn">&times;</span>

        <span class="arrow arrow-left" id="prevBtn">‹</span>
        <span class="arrow arrow-right" id="nextBtn">›</span>

        <div class="image-container" id="imageContainer">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>

        <div class="zoom-controls">
            <button id="zoomOutBtn">−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button id="zoomInBtn">+</button>
            <button id="zoomResetBtn" style="font-size:16px;">⟲</button>
        </div>

        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        function fixImagePath(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/bing-img/')) return url;
            if (url.startsWith('/')) {
                return `${BASE_PATH}${url}`;
            }
            return url;
        }

        // ============================================================
        // 2. 数据加载
        // ============================================================
        let allData = [];
        let currentPreviewIndex = 0;
        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const imageContainer = document.getElementById('imageContainer');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewDate = document.getElementById('previewDate');
        const zoomLevel = document.getElementById('zoomLevel');

        // ===== 缩放状态 =====
        let scale = 1;
        let minScale = 0.3;
        let maxScale = 5;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let lastTranslateX = 0;
        let lastTranslateY = 0;

        // ===== 加载数据 =====
        async function loadData() {
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    return;
                }
                renderAll();
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
            }
        }

        // ===== 渲染卡片 =====
        function renderAll() {
            const existingCards = grid.querySelectorAll('.card:not(.featured)');
            existingCards.forEach(el => el.remove());

            const sorted = [...allData].sort((a, b) => b.date.localeCompare(a.date));

            sorted.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = fixImagePath(item.webp || item.jpg || '');
                const fallback = fixImagePath(item.jpg || '');

                card.innerHTML = `
                    <img src="${imgSrc}" alt="${item.copyright || item.date}" loading="lazy" 
                         onerror="this.src='${fallback}'" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openPreview(index);
                });

                grid.appendChild(card);
            });
        }

        function showEmpty() {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.innerHTML = `
                <div class="icon">🖼️</div>
                <div>暂无壁纸数据</div>
            `;
            grid.appendChild(empty);
        }

        // ============================================================
        // 3. 全屏预览（带缩放拖拽）
        // ============================================================
        function openPreview(index) {
            if (allData.length === 0) return;
            currentPreviewIndex = index;
            resetZoom();
            showPreview(currentPreviewIndex);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;

            const item = allData[currentPreviewIndex];
            const imgSrc = fixImagePath(item.jpg || item.webp || '');
            previewImg.src = imgSrc;
            previewTitle.textContent = item.title || item.copyright || '';
            previewDate.textContent = item.date || '';

            // 重置缩放
            resetZoom();
        }

        function closePreview() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== 缩放函数 =====
        function updateTransform() {
            previewImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            zoomLevel.textContent = `${Math.round(scale * 100)}%`;
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            // 重置图片尺寸适应屏幕
            previewImg.style.width = 'auto';
            previewImg.style.height = 'auto';
            previewImg.style.maxWidth = '95vw';
            previewImg.style.maxHeight = '90vh';
            updateTransform();
        }

        function zoomIn() {
            if (scale >= maxScale) return;
            // 放大时移除尺寸限制
            previewImg.style.maxWidth = 'none';
            previewImg.style.maxHeight = 'none';
            scale = Math.min(scale + 0.2, maxScale);
            updateTransform();
        }

        function zoomOut() {
            if (scale <= minScale) return;
            scale = Math.max(scale - 0.2, minScale);
            if (scale <= 1) {
                // 缩到1以下时恢复适应屏幕
                previewImg.style.maxWidth = '95vw';
                previewImg.style.maxHeight = '90vh';
            }
            updateTransform();
        }

        // ===== 拖拽 =====
        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            const pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = e.type === 'mousemove' ? e : e.touches[0];
            const dx = pos.clientX - startX;
            const dy = pos.clientY - startY;
            translateX = lastTranslateX + dx;
            translateY = lastTranslateY + dy;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        // ===== 滚轮缩放 =====
        function wheelZoom(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (newScale > 1) {
                previewImg.style.maxWidth = 'none';
                previewImg.style.maxHeight = 'none';
            } else {
                previewImg.style.maxWidth = '95vw';
                previewImg.style.maxHeight = '90vh';
                translateX = 0;
                translateY = 0;
            }
            scale = newScale;
            updateTransform();
        }

        // ============================================================
        // 4. 事件绑定
        // ============================================================
        document.getElementById('closeBtn').addEventListener('click', closePreview);
        document.getElementById('prevBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
        });
        document.getElementById('nextBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
        });
        document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
        document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
        document.getElementById('zoomResetBtn').addEventListener('click', resetZoom);

        // 鼠标拖拽
        imageContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);

        // 触摸拖拽
        imageContainer.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });

        // 滚轮缩放
        imageContainer.addEventListener('wheel', wheelZoom, { passive: false });

        // 点击背景关闭
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePreview();
        });

        // 键盘
        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') showPreview(currentPreviewIndex - 1);
            if (e.key === 'ArrowRight') showPreview(currentPreviewIndex + 1);
            if (e.key === '+' || e.key === '=') zoomIn();
            if (e.key === '-') zoomOut();
            if (e.key === '0') resetZoom();
        });

        // ============================================================
        // 5. 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
