<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --bg-primary: #0d0d1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #1a1a2e;
            --text-primary: #fff;
            --text-secondary: rgba(255,255,255,0.5);
            --text-muted: rgba(255,255,255,0.25);
            --text-faint: rgba(255,255,255,0.12);
            --border-color: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --nav-bg: rgba(13,13,26,0.92);
            --pagination-bg: rgba(13,13,26,0.85);
            --shadow-color: rgba(0,0,0,0.5);
            --overlay-bg: rgba(0,0,0,0.92);
            --card-bg: #1a1a2e;
            --input-bg: rgba(255,255,255,0.05);
            --input-border: rgba(255,255,255,0.06);
            --btn-hover: rgba(255,255,255,0.08);
            --scrollbar-thumb: rgba(255,255,255,0.15);
            --scrollbar-thumb-hover: rgba(255,255,255,0.25);
            --progress-bar: linear-gradient(90deg, #4fc3f7, #00e5ff);
            --accent-color: #4fc3f7;
            --accent-hover: rgba(79,195,247,0.2);
            --detail-panel-bg: #1a1a2e;
            --arrow-bg-hover: rgba(255,255,255,0.08);
            --arrow-color: rgba(255,255,255,0.2);
            --arrow-color-hover: rgba(255,255,255,0.8);
            --btn-bg: rgba(0,0,0,0.4);
            --btn-border: rgba(255,255,255,0.08);
            --btn-color: rgba(255,255,255,0.7);
            --btn-hover-bg: rgba(0,0,0,0.6);
            --btn-hover-color: rgba(255,255,255,0.9);
            --meta-color: rgba(255,255,255,0.7);
            --meta-shadow: 0 2px 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.4);
            --resolution-bg: #1a1a2e;
            --detail-panel-bg: #1a1a2e;
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0,0,0,0.5);
            --text-muted: rgba(0,0,0,0.25);
            --text-faint: rgba(0,0,0,0.1);
            --border-color: rgba(0,0,0,0.06);
            --border-hover: rgba(0,0,0,0.12);
            --nav-bg: rgba(255,255,255,0.92);
            --pagination-bg: rgba(255,255,255,0.85);
            --shadow-color: rgba(0,0,0,0.08);
            --overlay-bg: rgba(255,255,255,0.95);
            --card-bg: #ffffff;
            --input-bg: rgba(0,0,0,0.04);
            --input-border: rgba(0,0,0,0.08);
            --btn-hover: rgba(0,0,0,0.06);
            --scrollbar-thumb: rgba(0,0,0,0.15);
            --scrollbar-thumb-hover: rgba(0,0,0,0.25);
            --detail-panel-bg: #ffffff;
            --arrow-bg-hover: rgba(0,0,0,0.06);
            --arrow-color: rgba(0,0,0,0.15);
            --arrow-color-hover: rgba(0,0,0,0.5);
            --btn-bg: rgba(255,255,255,0.6);
            --btn-border: rgba(0,0,0,0.06);
            --btn-color: rgba(0,0,0,0.6);
            --btn-hover-bg: rgba(255,255,255,0.9);
            --btn-hover-color: rgba(0,0,0,0.85);
            --meta-color: rgba(0,0,0,0.7);
            --meta-shadow: 0 2px 20px rgba(255,255,255,0.9), 0 0 40px rgba(255,255,255,0.4);
            --resolution-bg: #ffffff;
            --detail-panel-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            background: var(--bg-primary); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            overflow: hidden; 
            transition: background 0.3s ease, color 0.3s ease; 
            color: var(--text-primary); 
            -webkit-tap-highlight-color: transparent !important;
        }

        /* ===== 进度条 ===== */
        #progress-bar { position: fixed; top: 0; left: 0; height: 2.5px; background: var(--progress-bar); width: 0%; z-index: 9999; transition: width 0.3s ease; box-shadow: 0 0 12px rgba(79,195,247,0.4); }

        /* ===== 导航栏 ===== */
        .nav-toggle { position: fixed; top: 12px; left: 12px; z-index: 1001; background: var(--nav-bg); backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 20px; padding: 6px 12px; cursor: pointer; transition: 0.2s; line-height: 1; -webkit-tap-highlight-color: transparent; }
        .nav-toggle:hover { background: var(--accent-hover); border-color: rgba(79,195,247,0.2); }
        .nav-toggle.hidden { display: none !important; }
        .navbar { position: fixed; top: 12px; left: 56px; z-index: 1000; background: var(--nav-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 200px; opacity: 0; transform: translateY(-10px) scale(0.95); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; box-shadow: 0 8px 32px var(--shadow-color); max-width: 90vw; }
        .navbar.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .navbar-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .navbar .logo { color: var(--text-primary); font-size: 17px; font-weight: 300; display: flex; align-items: center; gap: 8px; }
        .navbar .logo span { color: var(--accent-color); font-weight: 600; }
        .navbar .badge { color: var(--text-secondary); font-size: 12px; }
        .navbar .search-box { display: flex; gap: 6px; width: 100%; }
        .navbar .search-box input { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 6px; padding: 5px 10px; color: var(--text-primary); font-size: 13px; outline: none; transition: 0.2s; }
        .navbar .search-box input:focus { border-color: var(--accent-color); }
        .navbar .search-box input::placeholder { color: var(--text-muted); }
        .navbar .search-box .search-btn { background: var(--accent-hover); border: none; color: var(--accent-color); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .navbar .search-box .search-btn:hover { background: rgba(79,195,247,0.25); color: var(--text-primary); }
        .navbar .nav-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .navbar .nav-actions a, .navbar .nav-actions button { background: var(--input-bg); border: none; color: var(--text-secondary); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; -webkit-tap-highlight-color: transparent; }
        .navbar .nav-actions a:hover, .navbar .nav-actions button:hover { background: var(--btn-hover); color: var(--text-primary); }
        .navbar .nav-actions .badge-dot { display: inline-block; width: 6px; height: 6px; background: #ff6b6b; border-radius: 50%; margin-left: 2px; animation: pulse-dot 2s infinite; }
        #themeToggle { background: var(--accent-hover); color: var(--accent-color); border-radius: 50%; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; }
        #themeToggle:hover { background: rgba(79,195,247,0.3); color: var(--text-primary); }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ===== 应用 ===== */
        .app { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            height: 100vh; 
            height: 100dvh;
            padding: 0; 
            overflow: hidden; 
            background: var(--bg-primary);
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 0;
            flex: 1;
            padding: 0;
            overflow-y: auto; 
            min-height: 0;
            background: var(--bg-primary);
            align-content: stretch;
            contain: layout style paint;
        }

        .grid::-webkit-scrollbar { width: 4px; }
        .grid::-webkit-scrollbar-track { background: transparent; }
        .grid::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }
        .grid::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

        /* ===== 卡片 ===== */
        .card {
            position: relative;
            overflow: hidden;
            background: var(--bg-card);
            width: 100%;
            height: 100%;
            min-height: 0;
            cursor: pointer;
            transition: background 0.3s ease;
            contain: strict;
            -webkit-tap-highlight-color: transparent;
            border-radius: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1);
            background: var(--bg-card);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .card img.loaded { opacity: 1; }
        .card:hover img { transform: scale(1.05); }

        .card .placeholder-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.7);
            transform: scale(1.04);
            transition: opacity 0.6s ease;
            z-index: 1;
            background-color: var(--bg-card);
        }

        .card .placeholder-bg.hidden { opacity: 0; }

        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 14px 12px 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info { opacity: 1; }
        .card .info .date { font-size: 10px; color: rgba(255,255,255,0.4); }
        .card .info .title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .info .copyright { font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ===== 分页 ===== */
        .pagination { 
            position: fixed; 
            bottom: 16px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            padding: 6px 14px; 
            background: var(--pagination-bg); 
            backdrop-filter: blur(16px); 
            border: 1px solid var(--border-color);
            border-radius: 10px; 
            box-shadow: 0 4px 30px var(--shadow-color); 
            z-index: 100; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 95vw; 
            transition: background 0.3s ease, border-color 0.3s ease; 
            pointer-events: auto;
        }
        
        .pagination button { 
            background: var(--input-bg); 
            border: none; 
            color: var(--text-secondary); 
            padding: 4px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px; 
            transition: 0.2s; 
            white-space: nowrap; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .pagination button:hover:not(:disabled) { background: var(--accent-hover); color: var(--accent-color); }
        .pagination button:disabled { opacity: 0.2; cursor: not-allowed; }
        .pagination .page-info { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
        .pagination .total-info { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
        .pagination .goto-box { display: flex; align-items: center; gap: 4px; }
        .pagination .goto-box input { width: 40px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 4px; padding: 3px 6px; color: var(--text-primary); font-size: 12px; text-align: center; outline: none; transition: 0.2s; }
        .pagination .goto-box input:focus { border-color: var(--accent-color); }
        .pagination .goto-box .goto-btn { background: var(--accent-hover); border: none; color: var(--accent-color); padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; -webkit-tap-highlight-color: transparent; }
        .pagination .goto-box .goto-btn:hover { background: rgba(79,195,247,0.3); color: var(--text-primary); }
        
        .empty { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-secondary); }
        .empty .icon { font-size: 40px; margin-bottom: 10px; }

        /* ============================================================
           大图预览
           ============================================================ */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .preview-overlay.active { display: flex; }

        .preview-overlay::before {
            content: '';
            position: fixed;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: center/cover no-repeat;
            filter: blur(30px) brightness(0.4);
            z-index: -1;
            transform: scale(1.1);
            transition: background-image 0.4s ease;
        }

        .preview-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }

        .preview-image {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            border-radius: 0;
            box-shadow: none;
            background: #0d0d1a;
            pointer-events: auto;
            cursor: pointer;
            z-index: 5;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 左右箭头 ===== */
        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 28px;
            padding: 16px 12px;
            cursor: pointer;
            transition: 0.25s ease;
            border-radius: 8px;
            z-index: 10;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            -webkit-touch-callout: none;
            user-select: none;
        }
        .arrow:focus { outline: none !important; box-shadow: none !important; }
        .arrow:hover { color: #fff; background: rgba(0, 0, 0, 0.5); }
        .arrow:active { background: rgba(0, 0, 0, 0.4); transform: translateY(-50%) scale(0.95); }
        .arrow-left { left: 12px; }
        .arrow-right { right: 12px; }

        /* ===== 顶部工具栏 ===== */
        .toolbar {
            position: fixed;
            top: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: flex-end;
            transition: opacity 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .toolbar .btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            white-space: nowrap;
            text-decoration: none;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }
        .toolbar .btn:focus { outline: none !important; box-shadow: none !important; }
        .toolbar .btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; border-color: rgba(255, 255, 255, 0.2); }

        /* ===== 捐赠二维码 ===== */
        .donate-qr-wrapper {
            position: relative;
            display: inline-block;
        }
        .donate-qr-wrapper .qr-tooltip {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            z-index: 30;
            min-width: 280px;
        }
        .donate-qr-wrapper .qr-tooltip::before {
            content: '';
            position: absolute;
            bottom: 100%;
            right: 20px;
            border: 8px solid transparent;
            border-bottom-color: rgba(20, 20, 35, 0.95);
        }
        .donate-qr-wrapper .qr-tooltip .qr-row { display: flex; gap: 12px; justify-content: center; align-items: center; }
        .donate-qr-wrapper .qr-tooltip .qr-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .donate-qr-wrapper .qr-tooltip .qr-item img { width: 110px; height: 110px; display: block; border-radius: 6px; background: #fff; padding: 4px; }
        .donate-qr-wrapper .qr-tooltip .qr-item .qr-label { color: rgba(255, 255, 255, 0.6); font-size: 11px; font-weight: 500; }
        .donate-qr-wrapper .qr-tooltip .qr-item .qr-label.wechat { color: #07c160; }
        .donate-qr-wrapper .qr-tooltip .qr-item .qr-label.alipay { color: #1677ff; }
        .donate-qr-wrapper .qr-tooltip .qr-footer { text-align: center; color: rgba(255, 255, 255, 0.35); font-size: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
        .donate-qr-wrapper:hover .qr-tooltip { display: block; }

        /* ===== 下载下拉菜单 ===== */
        .dropdown { position: relative; display: inline-block; }
        .dropdown .btn { padding-right: 8px; }
        .dropdown .btn i.fa-chevron-down { font-size: 9px; margin-left: 2px; opacity: 0.5; }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: rgba(20, 20, 35, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 4px 0;
            min-width: 130px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 20;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-menu a { display: block; padding: 6px 16px; color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 12px; transition: 0.15s; white-space: nowrap; }
        .dropdown-menu a:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .dropdown-menu .divider { height: 1px; background: rgba(255, 255, 255, 0.06); margin: 4px 12px; }

        .donate-modal { display: none !important; }

        /* ===== 底部信息 ===== */
        .info-panel {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9);
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .info-panel .copyright { font-size: 14px; color: rgba(255, 255, 255, 0.85); line-height: 1.5; }
        .info-panel .date { font-size: 12px; color: rgba(255, 255, 255, 0.4); margin-top: 4px; }
        .info-panel .desc { font-size: 13px; color: rgba(255, 255, 255, 0.5); margin-top: 4px; max-width: 500px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.6; }

        /* ============================================================
           ★★★ 评论弹窗 - Twikoo 白底黑字 ★★★
           ============================================================ */
        .comment-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }
        .comment-overlay.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .comment-modal {
            background: #ffffff !important;
            border-radius: 16px;
            width: 92%;
            max-width: 720px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid #e8e8e8;
            animation: slideUp 0.3s ease;
            overflow: hidden;
        }

        [data-theme="dark"] .comment-modal {
            background: #ffffff !important;
            border-color: #e8e8e8 !important;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px 14px;
            border-bottom: 1px solid #e8e8e8;
            flex-shrink: 0;
        }
        .comment-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .comment-header h2 i {
            color: #4fc3f7;
        }
        .comment-header .close-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;

    <!-- Twikoo CDN -->
    <script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.41/dist/twikoo.min.js"></script>
    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            var path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        var BASE_PATH = getBasePath();

        function getImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/')) return BASE_PATH + url;
            return url;
        }

        // ★★★ 缩略图函数 - 400x240 ★★★
        function getThumbnailUrl(url) {
            if (!url) return '';
            if (url.indexOf('th?id=') !== -1) {
                var baseUrl = url.split('&')[0];
                var thumbUrl = baseUrl.replace('_UHD.jpg', '_400x240.jpg');
                return thumbUrl;
            }
            return url;
        }

        // ============================================================
        // 2. 主题切换
        // ============================================================
        var themeToggle = document.getElementById('themeToggle');
        var currentTheme = localStorage.getItem('theme') || 'dark';

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.innerHTML = theme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        }
        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });
        setTheme(currentTheme);

        // ============================================================
        // 3. 进度条
        // ============================================================
        var progressBar = document.getElementById('progress-bar');

        function showProgress() {
            progressBar.style.width = '30%';
            setTimeout(function() { progressBar.style.width = '60%'; }, 150);
        }

        function hideProgress() {
            progressBar.style.width = '100%';
            setTimeout(function() { progressBar.style.width = '0%'; }, 350);
        }

        // ============================================================
        // 4. 导航栏
        // ============================================================
        var navToggle = document.getElementById('navToggle');
        var navbar = document.getElementById('navbar');
        var navOpen = false;

        function toggleNav(open) {
            navOpen = open !== undefined ? open : !navOpen;
            navbar.classList.toggle('open', navOpen);
            navToggle.innerHTML = navOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
        }

        navToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleNav();
        });
        document.addEventListener('click', function(e) {
            if (navOpen && !navbar.contains(e.target) && e.target !== navToggle) {
                toggleNav(false);
            }
        });

        // ============================================================
        // 5. 评论系统 - Twikoo
        // ============================================================
        var commentOverlay = document.getElementById('commentOverlay');
        var closeCommentBtn = document.getElementById('closeCommentBtn');
        var commentNavBtn = document.getElementById('commentNavBtn');

        function openComment() {
            commentOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            toggleNav(false);
            if (!document.getElementById('tcomment').hasChildNodes()) {
                initTwikoo();
            }
        }

        function closeComment() {
            commentOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function initTwikoo() {
            if (typeof twikoo === 'undefined') {
                setTimeout(initTwikoo, 500);
                return;
            }
            twikoo.init({
                envId: 'https://twikoo.hangdn.net',
                el: '#tcomment',
                lang: 'zh-CN',
            });
        }

        commentNavBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            openComment();
        });

        closeCommentBtn.addEventListener('click', closeComment);

        commentOverlay.addEventListener('click', function(e) {
            if (e.target === commentOverlay) {
                closeComment();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && commentOverlay.classList.contains('active')) {
                closeComment();
            }
        });

        // ============================================================
        // 6. 数据加载
        // ============================================================
        var allData = [];
        var filteredData = [];
        var currentPage = 1;
        var PAGE_SIZE = 30;
        var totalPages = 1;
        var currentPreviewIndex = 0;
        var currentPreviewItem = null;

        var grid = document.getElementById('grid');
        var previewOverlay = document.getElementById('previewOverlay');
        var previewImg = document.getElementById('previewImg');
        var previewCopyright = document.getElementById('previewCopyright');
        var previewDate = document.getElementById('previewDate');
        var previewDesc = document.getElementById('previewDesc');
        var totalNavCount = document.getElementById('totalNavCount');
        var searchInput = document.getElementById('searchInput');
        var searchBtn = document.getElementById('searchBtn');
        var homeBtn = document.getElementById('homeBtn');
        var prevBtn = document.getElementById('prevBtn');
        var nextBtn = document.getElementById('nextBtn');
        var pageInfo = document.getElementById('pageInfo');
        var totalInfo = document.getElementById('totalInfo');
        var gotoInput = document.getElementById('gotoInput');
        var gotoBtn = document.getElementById('gotoBtn');
        var closePreviewBtn = document.getElementById('closePreviewBtn');
        var donateBtn = document.getElementById('donateBtn');
        var donateModal = document.getElementById('donateModal');
        var closeDonate = document.getElementById('closeDonate');
        var downloadBtn = document.getElementById('downloadBtn');
        var downloadMenu = document.getElementById('downloadMenu');

        // 缩放状态
        var scale = 1,
            minScale = 0.3,
            maxScale = 5,
            translateX = 0,
            translateY = 0,
            isDragging = false,
            startX = 0,
            startY = 0,
            lastTranslateX = 0,
            lastTranslateY = 0;

        // 工具栏显示状态
        var toolbarVisible = true;

        // ============================================================
        // 6.1 加载数据
        // ============================================================
        async function loadData() {
            showProgress();
            try {
                var url = BASE_PATH + '/data/wallpapers.json';
                var res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    hideProgress();
                    return;
                }
                allData.sort(function(a, b) { return b.date.localeCompare(a.date); });
                filteredData = [];
                totalNavCount.textContent = allData.length;
                totalInfo.innerHTML = '<i class="fas fa-images"></i> 共 ' + allData.length + ' 张';
                currentPage = 1;
                renderPage(1);
                hideProgress();
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
                hideProgress();
            }
        }

        // ============================================================
        // 6.2 渲染页面 - ★★★ 使用 400x240 缩略图 ★★★
        // ============================================================
        function renderPage(page) {
            var data = filteredData.length > 0 ? filteredData : allData;
            totalPages = Math.ceil(data.length / PAGE_SIZE);
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            if (totalPages === 0) { showEmpty(); return; }
            currentPage = page;
            var start = (page - 1) * PAGE_SIZE;
            var end = Math.min(start + PAGE_SIZE, data.length);
            var items = data.slice(start, end);
            grid.innerHTML = '';
            if (items.length === 0) { showEmpty(); return; }

            items.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'card';

                // ★★★ 优先使用 thumb 缩略图（400x240）★★★
                var thumbSrc = getImageUrl(item.thumb || item.webp || item.jpg || '');
                // ★★★ 高清原图（备选）★★★
                var fullImgSrc = getImageUrl(item.webp || item.jpg || '');
                var fallback = getImageUrl(item.jpg || '');
                var placeholderSrc = getThumbnailUrl(thumbSrc);

                card.innerHTML =
                    '<div class="placeholder-bg" style="background-image: url(' + placeholderSrc + ');"></div>' +
                    '<img src="' + thumbSrc + '" alt="' + (item.copyright || item.date) + '" loading="lazy" />' +
                    '<div class="info">' +
                    '<div class="date">' + item.date + '</div>' +
                    '<div class="title">' + (item.copyright || '无标题') + '</div>' +
                    '<div class="copyright">' + (item.copyright || '') + '</div>' +
                    '</div>';

                var img = card.querySelector('img');
                var placeholderBg = card.querySelector('.placeholder-bg');

                img.addEventListener('load', function() {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                });
                if (img.complete) {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                }
                // ★★★ 缩略图加载失败时，回退到高清原图 ★★★
                img.addEventListener('error', function() {
                    if (fullImgSrc && fullImgSrc !== thumbSrc) {
                        this.src = fullImgSrc;
                    } else if (fallback && fallback !== thumbSrc) {
                        this.src = fallback;
                    } else {
                        this.classList.add('loaded');
                        placeholderBg.classList.add('hidden');
                    }
                });

                card.addEventListener('click', function() {
                    var targetIndex = -1;
                    for (var i = 0; i < allData.length; i++) {
                        if (allData[i].date === item.date) {
                            targetIndex = i;
                            break;
                        }
                    }
                    if (targetIndex === -1) return;
                    openPreview(targetIndex);
                });

                grid.appendChild(card);
            });

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            pageInfo.textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页';
            gotoInput.max = totalPages;
            gotoInput.placeholder = '1-' + totalPages;
            grid.scrollTop = 0;
        }

        // ============================================================
        // 6.3 分页事件
        // ============================================================
        prevBtn.addEventListener('click', function() { if (currentPage > 1) renderPage(currentPage - 1); });
        nextBtn.addEventListener('click', function() { if (currentPage < totalPages) renderPage(currentPage + 1); });
        gotoBtn.addEventListener('click', function() {
            var val = parseInt(gotoInput.value);
            if (!isNaN(val) && val >= 1 && val <= totalPages) renderPage(val);
            gotoInput.value = '';
        });
        gotoInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') gotoBtn.click(); });

        // ============================================================
        // 6.4 搜索
        // ============================================================
        function doSearch() {
            var keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) { filteredData = [];
                renderPage(1); return; }
            filteredData = allData.filter(function(item) {
                var copyright = (item.copyright || '').toLowerCase();
                var date = item.date || '';
                var dateClean = date.replace(/-/g, '');
                return copyright.indexOf(keyword) !== -1 || date.indexOf(keyword) !== -1 || dateClean.indexOf(keyword) !== -1;
            });
            if (filteredData.length === 0) {
                grid.innerHTML =
                    '<div class="empty"><div class="icon"><i class="fas fa-search"></i></div><div>没有匹配"' + keyword +
                    '"的壁纸</div></div>';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pageInfo.textContent = '第 0 / 0 页';
                return;
            }
            renderPage(1);
        }
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doSearch(); });
        homeBtn.addEventListener('click', function() {
            searchInput.value = '';
            filteredData = [];
            renderPage(1);
            toggleNav(false);
        });

        // ============================================================
        // 6.5 空状态
        // ============================================================
        function showEmpty() {
            grid.innerHTML =
                '<div class="empty"><div class="icon"><i class="fas fa-image"></i></div><div>暂无壁纸数据</div></div>';
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '第 0 / 0 页';
            totalInfo.innerHTML = '<i class="fas fa-images"></i> 共 0 张';
            totalNavCount.textContent = '0';
        }

        // ============================================================
        // 7. 大图预览
        // ============================================================

        function openPreview(index) {
            if (!allData || allData.length === 0) return;
            if (index < 0) index = 0;
            if (index >= allData.length) index = allData.length - 1;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];
            resetZoom();
            showPreview(currentPreviewIndex);
            previewOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            var imgSrc = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewOverlay.style.setProperty('--bg-url', 'url(' + imgSrc + ')');

            navToggle.classList.add('hidden');
            showToolbar();

            previewImg.onclick = function(e) {
                e.stopPropagation();
                toggleToolbar();
            };

            // 手机左右滑动切换
            var startX = 0;
            var startY = 0;

            previewImg.ontouchstart = function(e) {
                var touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
            };

            previewImg.ontouchend = function(e) {
                if (startX === 0) return;
                var touch = e.changedTouches[0];
                var deltaX = touch.clientX - startX;
                var deltaY = touch.clientY - startY;
                
                if (Math.abs(deltaX) > 30 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
                    if (deltaX > 0) {
                        showPreview(currentPreviewIndex - 1);
                    } else {
                        showPreview(currentPreviewIndex + 1);
                    }
                    showToolbar();
                }
                startX = 0;
                startY = 0;
            };
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];

            var imgSrc = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewImg.src = imgSrc;
            previewCopyright.textContent = currentPreviewItem.copyright || '';
            previewDate.textContent = currentPreviewItem.date || '';
            previewDesc.textContent = currentPreviewItem.description || '';
            previewOverlay.style.setProperty('--bg-url', 'url(' + imgSrc + ')');
            resetZoom();
        }

        function closePreview() {
            previewOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            navToggle.classList.remove('hidden');
            showToolbar();
        }

        function toggleToolbar() {
            toolbarVisible = !toolbarVisible;
            var arrows = document.querySelectorAll('.arrow');
            for (var i = 0; i < arrows.length; i++) {
                arrows[i].style.transition = 'opacity 0.3s ease';
                arrows[i].style.opacity = toolbarVisible ? '1' : '0';
                arrows[i].style.pointerEvents = toolbarVisible ? '' : 'none';
            }
            var toolbars = document.querySelectorAll('.toolbar');
            for (var i = 0; i < toolbars.length; i++) {
                toolbars[i].style.transition = 'opacity 0.3s ease';
                toolbars[i].style.opacity = toolbarVisible ? '1' : '0';
                toolbars[i].style.pointerEvents = toolbarVisible ? '' : 'none';
            }
            var infoPanels = document.querySelectorAll('.info-panel');
            for (var i = 0; i < infoPanels.length; i++) {
                infoPanels[i].style.transition = 'opacity 0.3s ease';
                infoPanels[i].style.opacity = toolbarVisible ? '1' : '0';
                infoPanels[i].style.pointerEvents = toolbarVisible ? '' : 'none';
            }
        }

        function showToolbar() {
            toolbarVisible = true;
            var allElements = document.querySelectorAll('.arrow, .toolbar, .info-panel');
            for (var i = 0; i < allElements.length; i++) {
                allElements[i].style.transition = 'opacity 0.3s ease';
                allElements[i].style.opacity = '1';
                allElements[i].style.pointerEvents = '';
            }
        }

        var prevPreviewBtn = document.getElementById('prevPreviewBtn');
        var nextPreviewBtn = document.getElementById('nextPreviewBtn');

        prevPreviewBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
            showToolbar();
        });

        nextPreviewBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
            showToolbar();
        });

        document.addEventListener('keydown', function(e) {
            if (!previewOverlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                showPreview(currentPreviewIndex - 1);
                showToolbar();
            }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                showPreview(currentPreviewIndex + 1);
                showToolbar();
            }
        });

        previewOverlay.addEventListener('click', function(e) {
            if (e.target === previewOverlay) closePreview();
        });

        closePreviewBtn.addEventListener('click', closePreview);

        // ============================================================
        // 7.1 下载下拉菜单 - 强制下载 + 手机竖屏裁剪
        // ============================================================
        downloadBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            downloadMenu.classList.toggle('show');
        });

        downloadMenu.querySelectorAll('a').forEach(function(item) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var res = this.getAttribute('data-res');
                downloadImage(currentPreviewIndex, res);
                downloadMenu.classList.remove('show');
            });
        });

        document.addEventListener('click', function() {
            downloadMenu.classList.remove('show');
        });

        function downloadImage(index, resolution) {
            if (!allData || allData.length === 0) return;
            var item = allData[index];
            if (!item) return;
            
            var url = getImageUrl(item.jpg || item.webp || '');
            var resolutions = {
                '4k': { w: 3840, h: 2160 },
                'fhd': { w: 1920, h: 1080 },
                'hd': { w: 1366, h: 768 },
                'mobile': { w: 1080, h: 1920 }
            };
            var res = resolutions[resolution] || resolutions['fhd'];
            var downloadUrl = url;
            
            if (resolution === 'mobile') {
                if (url.indexOf('th?id=') !== -1) {
                    var baseUrl = url.split('&')[0];
                    downloadUrl = baseUrl + '&w=1080&h=1920&crop=1';
                }
            } else {
                if (url.indexOf('th?id=') !== -1) {
                    var baseUrl = url.split('&')[0];
                    downloadUrl = baseUrl + '&w=' + res.w + '&h=' + res.h;
                }
            }
            
            var fileName = 'wallpaper_' + (item.date || '') + '_' + resolution + '.jpg';
            
            console.log('📥 开始下载: ' + fileName);
            console.log('📷 下载链接: ' + downloadUrl);
            
            fetch(downloadUrl, {
                mode: 'cors',
                headers: {
                    'Origin': window.location.origin
                }
            })
            .then(function(response) {
                if (!response.ok) throw new Error('网络请求失败');
                return response.blob();
            })
            .then(function(blob) {
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(function() {
                    URL.revokeObjectURL(link.href);
                }, 1000);
                
                console.log('✅ 下载成功: ' + fileName);
            })
            .catch(function(err) {
                console.warn('⚠️ Fetch 下载失败，使用备用方法:', err.message);
                
                var link = document.createElement('a');
                link.href = downloadUrl + (downloadUrl.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();
                link.download = fileName;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                console.log('📥 使用备用方法下载: ' + fileName);
            });
        }

        // ============================================================
        // 8. 缩放
        // ============================================================
        var imageContainer = previewImg;

        function updateTransform() {
            previewImg.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')';
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }

        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            var pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            var pos = e.type === 'mousemove' ? e : e.touches[0];
            translateX = lastTranslateX + pos.clientX - startX;
            translateY = lastTranslateY + pos.clientY - startY;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        function wheelZoom(e) {
            e.preventDefault();
            var delta = e.deltaY > 0 ? -0.15 : 0.15;
            scale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (scale <= 1) { translateX = 0;
                translateY = 0; }
            updateTransform();
        }

        previewImg.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);
        previewImg.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });
        previewImg.addEventListener('wheel', wheelZoom, { passive: false });

        // ============================================================
        // 9. 启动
        // ============================================================
        loadData();
        console.log('✅ 大图预览已加载');
        console.log('💡 留言按钮在导航栏（汉堡菜单）内');
        console.log('💡 评论系统: Twikoo');

        // 暴露 openComment 给 API 页面调用
        window.openComment = openComment;

        // 检测 URL 参数，自动打开留言弹窗
        (function checkUrlAction() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('action') === 'comment') {
                setTimeout(function() {
                    if (typeof openComment === 'function') {
                        openComment();
                    }
                    if (window.history && window.history.replaceState) {
                        var cleanUrl = window.location.pathname + window.location.hash;
                        window.history.replaceState({}, document.title, cleanUrl);
                    }
                }, 500);
            }
        })();
    </script>
</body>
</html>
