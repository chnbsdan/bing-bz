<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必应壁纸 · 每日精选</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* ===== 全屏主图 ===== */
        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0d0d1a;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.6s ease;
        }

        .hero .overlay-info {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            width: 90%;
            max-width: 800px;
        }

        .hero .overlay-info .date {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .hero .overlay-info .title {
            font-size: clamp(20px, 4vw, 42px);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .hero .overlay-info .copyright {
            font-size: 14px;
            opacity: 0.6;
            font-weight: 300;
        }

        .hero .nav-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 4px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.9;
            }
        }

        /* ===== 缩略图导航条 (底部) ===== */
        .thumbnails {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            z-index: 100;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
            justify-content: center;
        }

        .thumbnails::-webkit-scrollbar {
            height: 4px;
        }
        .thumbnails::-webkit-scrollbar-track {
            background: transparent;
        }
        .thumbnails::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .thumbnails .thumb {
            flex-shrink: 0;
            width: 120px;
            height: 68px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.25s ease, transform 0.2s ease;
            opacity: 0.5;
        }

        .thumbnails .thumb:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .thumbnails .thumb.active {
            border-color: #fff;
            opacity: 1;
        }

        .thumbnails .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== 加载占位 ===== */
        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            letter-spacing: 2px;
        }

        .loading-placeholder .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .thumbnails {
                padding: 8px 12px;
                gap: 6px;
                justify-content: flex-start;
            }
            .thumbnails .thumb {
                width: 80px;
                height: 45px;
            }
            .hero .overlay-info {
                bottom: 100px;
            }
            .hero .overlay-info .title {
                font-size: 18px;
            }
            .hero .overlay-info .copyright {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .thumbnails .thumb {
                width: 60px;
                height: 34px;
            }
            .hero .overlay-info .title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 主容器 ===== -->
    <div id="app">
        <div class="loading-placeholder" id="loading">
            <div class="spinner"></div>
            加载壁纸...
        </div>

        <!-- 全屏展示区 -->
        <div class="hero" id="hero" style="display:none;">
            <img id="mainImage" src="" alt="必应壁纸" />
            <div class="overlay-info">
                <div class="date" id="displayDate"></div>
                <div class="title" id="displayTitle"></div>
                <div class="copyright" id="displayCopyright"></div>
            </div>
            <div class="nav-hint">↓ 滑动浏览</div>
        </div>

        <!-- 底部缩略图导航 -->
        <div class="thumbnails" id="thumbnails"></div>
    </div>

    <script>
        // ============================================================
        // 1. 自动适配部署路径
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        // ============================================================
        // 2. 修正图片路径
        // ============================================================
        function fixImagePath(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/bing-img/')) return url;
            if (url.startsWith('/')) {
                return `${BASE_PATH}${url}`;
            }
            return url;
        }

        // ============================================================
        // 3. 主逻辑
        // ============================================================
        let wallpapers = [];
        let currentIndex = 0;

        const hero = document.getElementById('hero');
        const loading = document.getElementById('loading');
        const mainImage = document.getElementById('mainImage');
        const displayDate = document.getElementById('displayDate');
        const displayTitle = document.getElementById('displayTitle');
        const displayCopyright = document.getElementById('displayCopyright');
        const thumbnails = document.getElementById('thumbnails');

        async function loadData() {
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                wallpapers = await res.json();
                if (!Array.isArray(wallpapers) || wallpapers.length === 0) {
                    throw new Error('没有壁纸数据');
                }
                // 按日期排序（最新在前）
                wallpapers.sort((a, b) => b.date.localeCompare(a.date));
                initGallery();
            } catch (err) {
                console.error('加载失败:', err);
                loading.innerHTML = `
                    <div style="text-align:center;">
                        <div style="font-size:40px;margin-bottom:12px;">🖼️</div>
                        <div>加载壁纸失败</div>
                        <div style="font-size:13px;opacity:0.4;margin-top:6px;">${err.message}</div>
                    </div>
                `;
            }
        }

        function initGallery() {
            // 隐藏加载，显示主图
            loading.style.display = 'none';
            hero.style.display = 'block';

            // 渲染缩略图
            thumbnails.innerHTML = '';
            wallpapers.forEach((item, index) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumb';
                const imgSrc = fixImagePath(item.webp || item.jpg || '');
                thumb.innerHTML = `<img src="${imgSrc}" alt="${item.date}" loading="lazy" />`;
                thumb.addEventListener('click', () => {
                    showWallpaper(index);
                });
                thumbnails.appendChild(thumb);
            });

            // 显示第一张
            showWallpaper(0);

            // 键盘左右键切换
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    showWallpaper(currentIndex - 1);
                } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    showWallpaper(currentIndex + 1);
                }
            });

            // 触摸滑动支持
            let touchStartX = 0;
            let touchStartY = 0;
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });
            document.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].screenX - touchStartX;
                const dy = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                    if (dx < 0) showWallpaper(currentIndex + 1);
                    else showWallpaper(currentIndex - 1);
                }
            });

            // 滚轮切换
            let wheelTimeout = false;
            document.addEventListener('wheel', (e) => {
                if (wheelTimeout) return;
                if (e.deltaY > 30) {
                    wheelTimeout = true;
                    showWallpaper(currentIndex + 1);
                    setTimeout(() => wheelTimeout = false, 500);
                } else if (e.deltaY < -30) {
                    wheelTimeout = true;
                    showWallpaper(currentIndex - 1);
                    setTimeout(() => wheelTimeout = false, 500);
                }
            }, { passive: true });

            console.log(`✅ 加载完成，共 ${wallpapers.length} 张壁纸`);
        }

        function showWallpaper(index) {
            if (wallpapers.length === 0) return;
            // 循环
            if (index < 0) index = wallpapers.length - 1;
            if (index >= wallpapers.length) index = 0;
            currentIndex = index;

            const item = wallpapers[currentIndex];
            const imgSrc = fixImagePath(item.jpg || item.webp || '');

            // 预加载
            const img = new Image();
            img.onload = () => {
                mainImage.src = imgSrc;
            };
            img.onerror = () => {
                // 如果jpg加载失败，尝试webp
                const fallback = fixImagePath(item.webp || '');
                if (fallback) mainImage.src = fallback;
            };
            img.src = imgSrc;

            // 更新信息
            displayDate.textContent = item.date || '';
            displayTitle.textContent = item.title || '';
            displayCopyright.textContent = item.copyright || '';

            // 更新缩略图高亮
            document.querySelectorAll('.thumb').forEach((el, i) => {
                el.classList.toggle('active', i === currentIndex);
                // 滚动到可见区域
                if (i === currentIndex) {
                    el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });
        }

        // ============================================================
        // 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
