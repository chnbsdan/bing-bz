<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必应壁纸 · 每日精选</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d1a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        /* 头部 */
        .header {
            max-width: 1400px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .header h1 {
            color: #fff;
            font-weight: 400;
            font-size: 22px;
            letter-spacing: 2px;
        }
        .header h1 span {
            color: #4fc3f7;
            font-weight: 600;
        }
        .header .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            gap: 10px;
        }
        .header .search-box input {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .header .search-box input:focus {
            background: rgba(255, 255, 255, 0.15);
        }
        .header .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        .header .info-badge {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        /* 壁纸网格 - 一排7列 */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 每个卡片 */
        .card {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover {
            transform: scale(1.04);
            z-index: 10;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 悬停显示的信息浮层 */
        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 14px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        .card:hover .info {
            opacity: 1;
            transform: translateY(0);
        }
        .card .info .date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
        }
        .card .info .title {
            font-size: 14px;
            font-weight: 500;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .info .copyright {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 第一张卡片特殊处理：放网站标题 */
        .card.featured {
            background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 20px;
            cursor: default;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .card.featured:hover {
            transform: none;
            box-shadow: none;
        }
        .card.featured .logo {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 4px;
        }
        .card.featured .logo span {
            color: #4fc3f7;
            font-weight: 600;
        }
        .card.featured .sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 6px;
            letter-spacing: 6px;
        }
        .card.featured .count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 12px;
        }

        /* 加载指示器 */
        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 2px;
        }
        .loader .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #4fc3f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 全屏预览 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.94);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 40px;
            cursor: pointer;
        }
        .overlay.active {
            display: flex;
        }
        .overlay .close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
            z-index: 10;
        }
        .overlay .close:hover {
            opacity: 1;
        }
        .overlay img {
            max-width: 95%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .overlay .meta {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 24px;
            border-radius: 24px;
            max-width: 80%;
            pointer-events: none;
        }
        .overlay .meta .date {
            font-size: 12px;
            opacity: 0.6;
        }

        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
        }
        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .card .info .title {
                font-size: 11px;
            }
            .overlay {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- 头部 -->
    <header class="header">
        <h1>🌅 <span>必应</span>壁纸</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索壁纸 (标题/版权)..." />
        </div>
        <span class="info-badge" id="infoBadge">加载中...</span>
    </header>

    <!-- 壁纸网格 -->
    <div class="grid" id="grid">
        <!-- 第一个卡片：特色占位 -->
        <div class="card featured">
            <div class="logo">Bing <span>Wallpaper</span></div>
            <div class="sub">每日精选 · 版权可商用</div>
            <div class="count" id="totalCount">共 0 张</div>
        </div>
        <!-- 其他卡片由 JS 动态生成 -->
    </div>

    <!-- 全屏预览 -->
    <div class="overlay" id="overlay" onclick="closeOverlay()">
        <span class="close">&times;</span>
        <img id="previewImg" src="" alt="预览" />
        <div class="meta" id="previewMeta"></div>
    </div>

    <script>
        // ----- 数据加载与渲染 -----
        let allData = [];
        let currentPage = 0;
        const PAGE_SIZE = 28; // 每次加载28张 (4行)
        let isLoading = false;
        let hasMore = true;

        async function loadData() {
            try {
                const res = await fetch('/data/wallpapers.json');
                if (!res.ok) throw new Error('数据加载失败');
                allData = await res.json();
                document.getElementById('totalCount').textContent = `共 ${allData.length} 张`;
                document.getElementById('infoBadge').textContent = `📸 ${allData.length} 张壁纸`;
                hasMore = allData.length > 0;
                currentPage = 0;
                renderMore();
            } catch (err) {
                console.error(err);
                document.getElementById('infoBadge').textContent = '⚠️ 加载失败';
            }
        }

        function renderMore() {
            if (isLoading || !hasMore) return;
            isLoading = true;

            const start = currentPage * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allData.length);
            const slice = allData.slice(start, end);

            if (slice.length === 0) {
                hasMore = false;
                isLoading = false;
                return;
            }

            const grid = document.getElementById('grid');
            // 移除加载提示（如果存在）
            const existingLoader = grid.querySelector('.loader');
            if (existingLoader) existingLoader.remove();

            slice.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-date', item.date);
                card.setAttribute('data-title', (item.title || item.copyright || '').toLowerCase());

                // 使用 webp 加载更快，降级为 jpg
                const imgSrc = item.webp || item.jpg;
                card.innerHTML = `
                    <img src="${imgSrc}" alt="${item.copyright || item.date}" loading="lazy" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;
                // 点击打开大图
                card.addEventListener('click', () => openPreview(item.jpg, item));
                grid.appendChild(card);
            });

            currentPage++;
            isLoading = false;

            // 检查是否还有更多数据
            if (end >= allData.length) {
                hasMore = false;
            } else {
                // 添加底部加载提示
                const loader = document.createElement('div');
                loader.className = 'loader';
                loader.id = 'bottomLoader';
                loader.innerHTML = `<span class="spinner"></span> 加载中...`;
                grid.appendChild(loader);
            }
        }

        // 滚动加载
        function handleScroll() {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            if (scrollY + windowHeight >= documentHeight - 200) {
                renderMore();
            }
        }

        // 搜索过滤
        document.getElementById('searchInput').addEventListener('input', function() {
            const keyword = this.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.card:not(.featured)');
            cards.forEach(card => {
                const title = card.getAttribute('data-title') || '';
                const match = title.includes(keyword);
                card.style.display = match ? '' : 'none';
            });
            // 搜索时不触发滚动加载
        });

        // 全屏预览
        function openPreview(src, meta) {
            const overlay = document.getElementById('overlay');
            document.getElementById('previewImg').src = src;
            document.getElementById('previewMeta').innerHTML = `
                ${meta.title || meta.copyright || ''} 
                <span class="date"> · ${meta.date}</span>
            `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeOverlay() {
            document.getElementById('overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeOverlay();
        });

        // ----- 启动 -----
        window.addEventListener('scroll', handleScroll);
        loadData();
    </script>

</body>
</html>
