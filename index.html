<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* ===== 导航栏触发按钮 ===== */
        .nav-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: rgba(13, 13, 26, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            padding: 6px 12px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }

        .nav-toggle:hover {
            background: rgba(79, 195, 247, 0.2);
            border-color: rgba(79, 195, 247, 0.3);
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(13, 13, 26, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            max-width: 90vw;
        }

        .navbar.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .navbar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .navbar .logo {
            color: #fff;
            font-size: 18px;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .navbar .logo .icon {
            font-size: 22px;
        }

        .navbar .logo span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .navbar-close {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .navbar-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .navbar .badge {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .navbar .badge span {
            color: rgba(255, 255, 255, 0.5);
        }

        .navbar .search-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .navbar .search-box input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 5px 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        .navbar .search-box input:focus {
            border-color: #4fc3f7;
            background: rgba(255, 255, 255, 0.1);
        }

        .navbar .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .navbar .search-box .search-btn {
            background: rgba(79, 195, 247, 0.15);
            border: none;
            color: #4fc3f7;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .navbar .search-box .search-btn:hover {
            background: rgba(79, 195, 247, 0.3);
            color: #fff;
        }

        .navbar .nav-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .navbar .nav-actions button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .navbar .nav-actions button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* ===== 应用容器 ===== */
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        /* ===== 网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
            flex: 1;
            align-content: start;
            overflow-y: auto;
            padding-bottom: 60px;
            scroll-behavior: smooth;
        }

        .card {
            position: relative;
            aspect-ratio: 16 / 11;
            background: #0d0d1a;
            overflow: hidden;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }

        /* ★★★ 占位图模糊效果 ★★★ */
        .card img.placeholder {
            filter: blur(8px) brightness(0.8);
            transform: scale(1.05);
            transition: filter 0.4s ease, transform 0.4s ease;
        }

        .card img.loaded {
            filter: blur(0) brightness(1);
            transform: scale(1);
        }

        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 10px 8px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info {
            opacity: 1;
        }

        .card .info .date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .card .info .title {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .copyright {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 加载更多指示器 ===== */
        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px 0;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 2px;
        }

        .loader .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 空状态 ===== */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.2);
        }

        .empty .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* ===== 浮动分页控制栏 ===== */
        .pagination {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(13, 13, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 96vw;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #e0e0e0;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(79, 195, 247, 0.2);
            color: #4fc3f7;
        }

        .pagination button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .pagination .total-info {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
        }

        .pagination .goto-box {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pagination .goto-box input {
            width: 44px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 3px 4px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            outline: none;
        }

        .pagination .goto-box input:focus {
            border-color: #4fc3f7;
        }

        .pagination .goto-box input::-webkit-outer-spin-button,
        .pagination .goto-box input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .pagination .goto-box input[type=number] {
            -moz-appearance: textfield;
        }

        .pagination .goto-box .goto-btn {
            background: rgba(79, 195, 247, 0.15);
            border: none;
            color: #4fc3f7;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .pagination .goto-box .goto-btn:hover {
            background: rgba(79, 195, 247, 0.3);
            color: #fff;
        }

        /* ============================================================
           全屏预览遮罩
           ============================================================ */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            overflow: hidden;
            user-select: none;
        }

        .overlay.active {
            display: block;
        }

        .overlay .close {
            position: fixed;
            top: 16px;
            right: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 34px;
            cursor: pointer;
            z-index: 100;
            font-family: serif;
            line-height: 1;
            transition: 0.2s;
            background: transparent;
            border: none;
        }

        .overlay .close:hover {
            color: #fff;
        }

        .overlay .action-buttons {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .overlay:hover .action-buttons {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay .action-buttons a,
        .overlay .action-buttons button {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 13px;
            padding: 5px 16px;
            border-radius: 6px;
            transition: 0.2s;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        .overlay .action-buttons a:hover,
        .overlay .action-buttons button:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .overlay .action-buttons .btn-download {
            color: #4fc3f7;
            border-color: rgba(79, 195, 247, 0.2);
        }

        .overlay .action-buttons .btn-download:hover {
            color: #fff;
            border-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.1);
        }

        .overlay .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
        }

        .overlay .image-container:active {
            cursor: grabbing;
        }

        .overlay .preview-image {
            display: block;
            max-width: none;
            max-height: none;
            pointer-events: none;
            transform-origin: center center;
            transition: none;
            will-change: transform;
            width: auto;
            height: auto;
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .overlay .meta {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 17px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 10px;
            max-width: 80%;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .overlay:hover .meta {
            opacity: 1;
        }

        .overlay .meta .date {
            font-size: 13px;
            opacity: 0.5;
            display: block;
            margin-top: 2px;
        }

        .overlay .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 44px;
            cursor: pointer;
            padding: 16px 10px;
            z-index: 50;
            font-family: serif;
            line-height: 1;
            user-select: none;
            transition: 0.2s;
            background: transparent;
            border: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay:hover .arrow {
            opacity: 1;
        }

        .overlay .arrow:hover {
            color: #fff;
        }

        .overlay .arrow-left {
            left: 8px;
        }

        .overlay .arrow-right {
            right: 8px;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .navbar {
                min-width: 170px;
                padding: 12px 14px;
                top: 10px;
                left: 10px;
            }
            .navbar .logo {
                font-size: 16px;
            }
            .nav-toggle {
                font-size: 18px;
                padding: 5px 10px;
                top: 10px;
                left: 10px;
            }
            .overlay .meta {
                font-size: 15px;
                padding: 6px 16px;
                bottom: 110px;
            }
            .overlay .meta .date {
                font-size: 12px;
            }
            .pagination {
                padding: 5px 10px;
                gap: 5px;
            }
            .pagination button {
                font-size: 11px;
                padding: 3px 8px;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                padding-bottom: 70px;
            }
            .card {
                aspect-ratio: 16 / 12;
            }
            .navbar {
                min-width: 150px;
                padding: 10px 12px;
                top: 8px;
                left: 8px;
            }
            .navbar .logo {
                font-size: 14px;
            }
            .navbar .logo .icon {
                font-size: 16px;
            }
            .navbar .search-box input {
                font-size: 12px;
                padding: 4px 8px;
            }
            .navbar .search-box .search-btn {
                font-size: 12px;
                padding: 4px 8px;
            }
            .navbar .nav-actions button {
                font-size: 12px;
                padding: 4px 8px;
            }
            .navbar-close {
                font-size: 16px;
                padding: 0 6px;
            }
            .nav-toggle {
                font-size: 16px;
                padding: 4px 8px;
                top: 8px;
                left: 8px;
            }
            .pagination {
                padding: 4px 8px;
                gap: 4px;
                max-width: 98vw;
                bottom: 6px;
                border-radius: 10px;
            }
            .pagination button {
                font-size: 10px;
                padding: 2px 6px;
            }
            .pagination .page-info {
                font-size: 10px;
            }
            .pagination .total-info {
                font-size: 9px;
            }
            .pagination .goto-box input {
                width: 30px;
                font-size: 10px;
                padding: 2px 3px;
            }
            .pagination .goto-box .goto-btn {
                font-size: 10px;
                padding: 2px 6px;
            }
            .overlay .arrow {
                font-size: 26px;
                padding: 8px 4px;
            }
            .overlay .arrow-left {
                left: 2px;
            }
            .overlay .arrow-right {
                right: 2px;
            }
            .overlay .close {
                font-size: 26px;
                top: 10px;
                right: 14px;
            }
            .overlay .action-buttons {
                bottom: 60px;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .overlay .action-buttons a,
            .overlay .action-buttons button {
                font-size: 11px;
                padding: 4px 10px;
            }
            .overlay .meta {
                font-size: 13px;
                padding: 5px 12px;
                bottom: 105px;
                max-width: 90%;
            }
            .overlay .meta .date {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏触发按钮 ===== -->
    <button class="nav-toggle" id="navToggle" aria-label="切换导航">☰</button>

    <!-- ===== 浮动导航栏 ===== -->
    <div class="navbar" id="navbar">
        <div class="navbar-header">
            <div class="logo">
                <span class="icon">🌅</span>
                Bing <span>Wallpaper</span>
            </div>
            <button class="navbar-close" id="navClose">✕</button>
        </div>
        <div class="badge"><span id="totalNavCount">0</span> 张</div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索年份/关键词..." />
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>

        <div class="nav-actions">
            <button id="homeBtn">🏠 首页</button>
        </div>
    </div>

    <!-- ===== 应用容器 ===== -->
    <div class="app">
        <div class="grid" id="grid"></div>
    </div>

    <!-- ===== 浮动分页控制栏 ===== -->
    <div class="pagination" id="pagination">
        <button id="prevBtn" disabled>‹ 上一页</button>
        <span class="page-info" id="pageInfo">第 1 / 1 页</span>
        <span class="total-info" id="totalInfo">共 0 张</span>
        <button id="nextBtn">下一页 ›</button>

        <div class="goto-box">
            <input type="number" id="gotoInput" min="1" placeholder="页" />
            <button class="goto-btn" id="gotoBtn">跳转</button>
        </div>
    </div>

    <!-- ===== 全屏预览遮罩 ===== -->
    <div class="overlay" id="overlay">
        <button class="close" id="closeBtn">&times;</button>
        <button class="arrow arrow-left" id="prevPreviewBtn">‹</button>
        <button class="arrow arrow-right" id="nextPreviewBtn">›</button>

        <div class="image-container" id="imageContainer">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>

        <div class="action-buttons">
            <a href="#" id="openLinkBtn" target="_blank" rel="noopener">🔗 打开链接</a>
            <button class="btn-download" id="downloadBtn">⬇️ 下载4K图片</button>
        </div>

        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        function fixImagePath(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/bing-img/')) return url;
            if (url.startsWith('/')) {
                return `${BASE_PATH}${url}`;
            }
            return url;
        }

        // ============================================================
        // 2. 导航栏
        // ============================================================
        const navToggle = document.getElementById('navToggle');
        const navbar = document.getElementById('navbar');
        const navClose = document.getElementById('navClose');
        let navOpen = false;

        function toggleNav(open) {
            navOpen = open !== undefined ? open : !navOpen;
            navbar.classList.toggle('open', navOpen);
            navToggle.textContent = navOpen ? '✕' : '☰';
        }

        navToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleNav();
        });

        navClose.addEventListener('click', () => {
            toggleNav(false);
        });

        document.addEventListener('click', (e) => {
            if (navOpen && !navbar.contains(e.target) && e.target !== navToggle) {
                toggleNav(false);
            }
        });

        // ============================================================
        // 3. 数据 + 分页（模拟 bing.ioliu.cn 的分页加载）
        // ============================================================
        let allData = [];
        let filteredData = [];
        let currentPage = 0;
        const PAGE_SIZE = 42;
        let currentPreviewIndex = 0;
        let currentPreviewItem = null;
        let totalCount = 0;
        let totalPages = 0;

        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const imageContainer = document.getElementById('imageContainer');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewDate = document.getElementById('previewDate');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const totalInfo = document.getElementById('totalInfo');
        const totalNavCount = document.getElementById('totalNavCount');
        const openLinkBtn = document.getElementById('openLinkBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const homeBtn = document.getElementById('homeBtn');
        const gotoInput = document.getElementById('gotoInput');
        const gotoBtn = document.getElementById('gotoBtn');

        // 缩放状态
        let scale = 1;
        let minScale = 0.3;
        let maxScale = 5;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let lastTranslateX = 0;
        let lastTranslateY = 0;

        // ===== 获取当前显示的数据 =====
        function getCurrentData() {
            return filteredData.length > 0 ? filteredData : allData;
        }

        // ===== 加载数据（一次性加载全部，但分页渲染） =====
        async function loadData() {
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    return;
                }
                allData.sort((a, b) => b.date.localeCompare(a.date));
                filteredData = [];
                totalCount = allData.length;
                totalPages = Math.ceil(totalCount / PAGE_SIZE);
                totalInfo.textContent = `共 ${totalCount} 张`;
                totalNavCount.textContent = totalCount;
                currentPage = 0;
                renderPage(0);
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
            }
        }

        // ===== ★★★ 核心：渲染指定页（带占位图） ★★★ =====
        function renderPage(page) {
            const data = getCurrentData();
            const totalPages = Math.ceil(data.length / PAGE_SIZE);
            if (page < 0) page = 0;
            if (page >= totalPages) page = totalPages - 1;
            if (page < 0 || totalPages === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div class="icon">🔍</div>
                        <div>没有匹配的壁纸</div>
                    </div>
                `;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pageInfo.textContent = '第 0 / 0 页';
                return;
            }

            currentPage = page;
            const start = page * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, data.length);
            const slice = data.slice(start, end);

            // 清空网格，保留滚动位置
            grid.innerHTML = '';

            slice.forEach((item, index) => {
                const realIndex = start + index;
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = fixImagePath(item.webp || item.jpg || '');
                const fallback = fixImagePath(item.jpg || '');

                // ★★★ 占位图：先用压缩版，加载完成后替换 ★★★
                // 如果 CDN 支持尺寸参数，用 &w=200 生成小图作为占位
                const placeholderSrc = imgSrc.includes('?') 
                    ? `${imgSrc}&w=200` 
                    : `${imgSrc}?w=200`;

                card.innerHTML = `
                    <img src="${placeholderSrc}" 
                         data-src="${imgSrc}" 
                         alt="${item.copyright || item.date}" 
                         loading="lazy"
                         class="placeholder" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;

                // ★★★ 图片加载完成后切换为高清图 ★★★
                const img = card.querySelector('img');
                
                // 先尝试加载高清图
                const highResImg = new Image();
                highResImg.onload = function() {
                    img.src = highResImg.src;
                    img.classList.remove('placeholder');
                    img.classList.add('loaded');
                };
                highResImg.onerror = function() {
                    // 如果高清图加载失败，用 fallback
                    if (fallback && fallback !== imgSrc) {
                        const fallbackImg = new Image();
                        fallbackImg.onload = function() {
                            img.src = fallbackImg.src;
                            img.classList.remove('placeholder');
                            img.classList.add('loaded');
                        };
                        fallbackImg.src = fallback;
                    } else {
                        img.classList.remove('placeholder');
                        img.classList.add('loaded');
                    }
                };
                highResImg.src = imgSrc;

                card.addEventListener('click', () => {
                    const originalIndex = allData.indexOf(item);
                    openPreview(originalIndex >= 0 ? originalIndex : realIndex);
                });

                grid.appendChild(card);
            });

            // 更新分页控制
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= totalPages - 1;
            pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 页`;
            gotoInput.max = totalPages;
            gotoInput.placeholder = `1-${totalPages}`;
        }

        // ===== 分页按钮事件 =====
        prevBtn.addEventListener('click', () => {
            if (currentPage > 0) renderPage(currentPage - 1);
        });

        nextBtn.addEventListener('click', () => {
            const data = getCurrentData();
            const totalPages = Math.ceil(data.length / PAGE_SIZE);
            if (currentPage < totalPages - 1) renderPage(currentPage + 1);
        });

        // ===== 跳转 =====
        gotoBtn.addEventListener('click', () => {
            const data = getCurrentData();
            const totalPages = Math.ceil(data.length / PAGE_SIZE);
            const val = parseInt(gotoInput.value);
            if (!isNaN(val) && val >= 1 && val <= totalPages) {
                renderPage(val - 1);
            }
            gotoInput.value = '';
        });

        gotoInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') gotoBtn.click();
        });

        // ===== 搜索 =====
        function doSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) {
                filteredData = [];
                renderPage(0);
                return;
            }
            filteredData = allData.filter(item => {
                const title = (item.title || '').toLowerCase();
                const copyright = (item.copyright || '').toLowerCase();
                const date = item.date || '';
                return title.includes(keyword) || copyright.includes(keyword) || date.includes(keyword);
            });
            if (filteredData.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div class="icon">🔍</div>
                        <div>没有匹配"${keyword}"的壁纸</div>
                    </div>
                `;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pageInfo.textContent = '第 0 / 0 页';
                return;
            }
            renderPage(0);
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // ===== 首页 =====
        homeBtn.addEventListener('click', () => {
            searchInput.value = '';
            filteredData = [];
            renderPage(0);
            toggleNav(false);
        });

        // ===== 空状态 =====
        function showEmpty() {
            grid.innerHTML = `
                <div class="empty">
                    <div class="icon">🖼️</div>
                    <div>暂无壁纸数据</div>
                </div>
            `;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '第 0 / 0 页';
            totalInfo.textContent = '共 0 张';
            totalNavCount.textContent = '0';
        }

        // ============================================================
        // 4. 全屏预览
        // ============================================================
        function openPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = 0;
            if (index >= allData.length) index = allData.length - 1;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];
            resetZoom();
            showPreview(currentPreviewIndex);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateActionButtons();
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];

            const imgSrc = fixImagePath(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewImg.src = imgSrc;
            previewTitle.textContent = currentPreviewItem.title || currentPreviewItem.copyright || '';
            previewDate.textContent = currentPreviewItem.date || '';
            updateActionButtons();
            resetZoom();
        }

        function updateActionButtons() {
            if (!currentPreviewItem) return;
            const url = currentPreviewItem.jpg || currentPreviewItem.webp || '';
            const fullUrl = fixImagePath(url);
            openLinkBtn.href = fullUrl;
            downloadBtn.onclick = function(e) {
                e.preventDefault();
                downloadImage(fullUrl);
            };
        }

        async function downloadImage(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                const fileName = url.split('/').pop().split('?')[0] || 'wallpaper.jpg';
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (err) {
                window.open(url, '_blank');
            }
        }

        function closePreview() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== 缩放 =====
        function updateTransform() {
            previewImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            previewImg.style.width = 'auto';
            previewImg.style.height = 'auto';
            previewImg.style.maxWidth = '95vw';
            previewImg.style.maxHeight = '85vh';
            updateTransform();
        }

        // ===== 拖拽 =====
        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            const pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = e.type === 'mousemove' ? e : e.touches[0];
            const dx = pos.clientX - startX;
            const dy = pos.clientY - startY;
            translateX = lastTranslateX + dx;
            translateY = lastTranslateY + dy;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        function wheelZoom(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            const newScale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (newScale > 1) {
                previewImg.style.maxWidth = 'none';
                previewImg.style.maxHeight = 'none';
            } else {
                previewImg.style.maxWidth = '95vw';
                previewImg.style.maxHeight = '85vh';
                translateX = 0;
                translateY = 0;
            }
            scale = newScale;
            updateTransform();
        }

        // ============================================================
        // 5. 事件绑定
        // ============================================================
        document.getElementById('closeBtn').addEventListener('click', closePreview);
        document.getElementById('prevPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
        });
        document.getElementById('nextPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
        });

        imageContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);

        imageContainer.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });

        imageContainer.addEventListener('wheel', wheelZoom, { passive: false });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePreview();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') showPreview(currentPreviewIndex - 1);
            if (e.key === 'ArrowRight') showPreview(currentPreviewIndex + 1);
        });

        // ============================================================
        // 6. 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
