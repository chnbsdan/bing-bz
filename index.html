<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必应壁纸 · 每日精选</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 16px;
        }

        /* ===== 顶部导航 ===== */
        .header {
            max-width: 100%;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }

        .header h1 {
            color: #fff;
            font-weight: 400;
            font-size: 20px;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .header h1 span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .header .info-badge {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin-left: auto;
            white-space: nowrap;
        }

        /* ===== 图片网格：7列，填满屏幕 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            max-width: 100%;
            min-height: calc(100vh - 120px);
            align-content: start;
        }

        /* ===== 每个卡片 ===== */
        .card {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: scale(1.04);
            z-index: 10;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== 悬停信息浮层 ===== */
        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px 12px 10px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .card:hover .info {
            opacity: 1;
            transform: translateY(0);
        }

        .card .info .date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
        }

        .card .info .title {
            font-size: 13px;
            font-weight: 500;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .copyright {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 第一个卡片：网站标识 ===== */
        .card.featured {
            background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 16px;
            cursor: default;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card.featured:hover {
            transform: none;
            box-shadow: none;
        }

        .card.featured .logo {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 3px;
        }

        .card.featured .logo span {
            color: #4fc3f7;
            font-weight: 600;
        }

        .card.featured .sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 4px;
            letter-spacing: 4px;
        }

        .card.featured .count {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 10px;
        }

        /* ===== 加载更多指示器 ===== */
        .loader {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px 0;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            letter-spacing: 2px;
        }

        .loader .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 空状态 ===== */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.25);
        }

        .empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* ===== 全屏预览遮罩 ===== */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.94);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: pointer;
            user-select: none;
        }

        .overlay.active {
            display: flex;
        }

        /* ===== 关闭按钮 ===== */
        .overlay .close {
            position: absolute;
            top: 24px;
            right: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 32px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
            font-family: serif;
            line-height: 1;
        }

        .overlay .close:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        /* ===== 大图 ===== */
        .overlay .preview-image {
            max-width: 92%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        /* ===== 大图底部信息 ===== */
        .overlay .meta {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 22px;
            border-radius: 24px;
            max-width: 80%;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        .overlay .meta .date {
            font-size: 12px;
            opacity: 0.5;
            display: block;
        }

        /* ===== 左右箭头 ===== */
        .overlay .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 48px;
            cursor: pointer;
            padding: 20px 16px;
            transition: 0.2s;
            z-index: 10;
            font-family: serif;
            line-height: 1;
            user-select: none;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .overlay .arrow:hover {
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
        }

        .overlay .arrow-left {
            left: 20px;
        }

        .overlay .arrow-right {
            right: 20px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header .info-badge {
                margin-left: 0;
            }
            .overlay .arrow {
                font-size: 32px;
                padding: 12px 10px;
            }
            .overlay .arrow-left {
                left: 6px;
            }
            .overlay .arrow-right {
                right: 6px;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            body {
                padding: 8px;
            }
            .header h1 {
                font-size: 16px;
            }
            .card .info .title {
                font-size: 11px;
            }
            .card.featured .logo {
                font-size: 18px;
            }
            .overlay .preview-image {
                max-width: 98%;
                max-height: 70vh;
            }
            .overlay .meta {
                font-size: 12px;
                padding: 6px 14px;
                bottom: 16px;
            }
            .overlay .arrow {
                font-size: 24px;
                padding: 8px 6px;
            }
            .overlay .close {
                top: 14px;
                right: 18px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航 ===== -->
    <header class="header">
        <h1>🌅 <span>必应</span>壁纸</h1>
        <span class="info-badge" id="infoBadge">加载中...</span>
    </header>

    <!-- ===== 图片网格 ===== -->
    <div class="grid" id="grid">
        <!-- 第一个卡片：网站标识 -->
        <div class="card featured">
            <div class="logo">Bing <span>Wallpaper</span></div>
            <div class="sub">每日精选</div>
            <div class="count" id="totalCount">加载中...</div>
        </div>
    </div>

    <!-- ===== 全屏预览遮罩 ===== -->
    <div class="overlay" id="overlay">
        <span class="close" id="closeBtn">&times;</span>

        <span class="arrow arrow-left" id="prevBtn">‹</span>
        <span class="arrow arrow-right" id="nextBtn">›</span>

        <img class="preview-image" id="previewImg" src="" alt="预览" />

        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 自动适配部署路径
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        // ============================================================
        // 2. 修正图片路径
        // ============================================================
        function fixImagePath(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/bing-img/')) return url;
            if (url.startsWith('/')) {
                return `${BASE_PATH}${url}`;
            }
            return url;
        }

        // ============================================================
        // 3. 主逻辑
        // ============================================================
        let allData = [];
        let currentPreviewIndex = 0;
        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewDate = document.getElementById('previewDate');

        // ===== 加载数据 =====
        async function loadData() {
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    return;
                }
                document.getElementById('totalCount').textContent = `共 ${allData.length} 张`;
                document.getElementById('infoBadge').textContent = `📸 ${allData.length} 张壁纸`;
                renderAll();
            } catch (err) {
                console.error('加载失败:', err);
                document.getElementById('infoBadge').textContent = '⚠️ 加载失败';
                showEmpty();
            }
        }

        // ===== 渲染所有卡片 =====
        function renderAll() {
            // 移除旧的卡片（保留第一个 featured）
            const existingCards = grid.querySelectorAll('.card:not(.featured)');
            existingCards.forEach(el => el.remove());

            // 按日期排序（最新在前）
            const sorted = [...allData].sort((a, b) => b.date.localeCompare(a.date));

            sorted.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = fixImagePath(item.webp || item.jpg || '');
                const fallback = fixImagePath(item.jpg || '');

                card.innerHTML = `
                    <img src="${imgSrc}" alt="${item.copyright || item.date}" loading="lazy" 
                         onerror="this.src='${fallback}'" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openPreview(index);
                });

                grid.appendChild(card);
            });
        }

        // ===== 空状态 =====
        function showEmpty() {
            document.getElementById('totalCount').textContent = '暂无壁纸';
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.innerHTML = `
                <div class="icon">🖼️</div>
                <div>还没有壁纸数据</div>
                <div style="font-size:13px;color:rgba(255,255,255,0.2);margin-top:6px;">
                    请运行 <code>npm run fetch</code> 抓取壁纸
                </div>
            `;
            grid.appendChild(empty);
        }

        // ============================================================
        // 4. 全屏预览
        // ============================================================
        function openPreview(index) {
            if (allData.length === 0) return;
            currentPreviewIndex = index;
            showPreview(currentPreviewIndex);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            if (index < 0) index = allData.length - 1;
            if (index >= allData.length) index = 0;
            currentPreviewIndex = index;

            const item = allData[currentPreviewIndex];
            // 预览优先用 jpg（更清晰），降级 webp
            const imgSrc = fixImagePath(item.jpg || item.webp || '');
            previewImg.src = imgSrc;
            previewTitle.textContent = item.title || item.copyright || '';
            previewDate.textContent = item.date || '';
        }

        function closePreview() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function prevImage(e) {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
        }

        function nextImage(e) {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
        }

        // ===== 绑定事件 =====
        document.getElementById('closeBtn').addEventListener('click', closePreview);
        document.getElementById('prevBtn').addEventListener('click', prevImage);
        document.getElementById('nextBtn').addEventListener('click', nextImage);

        // 点击遮罩背景关闭
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePreview();
        });

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') showPreview(currentPreviewIndex - 1);
            if (e.key === 'ArrowRight') showPreview(currentPreviewIndex + 1);
        });

        // ============================================================
        // 5. 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
