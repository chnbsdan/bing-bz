<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>必应壁纸 · 每日精选</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .header {
            max-width: 1400px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 10px 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
        }
        .header h1 {
            color: #fff;
            font-weight: 400;
            font-size: 22px;
            letter-spacing: 2px;
        }
        .header h1 span { color: #4fc3f7; font-weight: 600; }
        .header .info-badge {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-left: auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            position: relative;
            aspect-ratio: 16/9;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover {
            transform: scale(1.04);
            z-index: 10;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 14px 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        .card:hover .info {
            opacity: 1;
            transform: translateY(0);
        }
        .card .info .date {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            font-weight: 300;
        }
        .card .info .title {
            font-size: 14px;
            font-weight: 500;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .info .copyright {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card.featured {
            background: linear-gradient(135deg, #1a1a3e, #0d0d2b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 20px;
            cursor: default;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card.featured:hover { transform: none; box-shadow: none; }
        .card.featured .logo {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 4px;
        }
        .card.featured .logo span { color: #4fc3f7; font-weight: 600; }
        .card.featured .sub {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-top: 6px;
            letter-spacing: 6px;
        }
        .card.featured .count {
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            margin-top: 12px;
        }
        .loader {
            grid-column: 1/-1;
            text-align: center;
            padding: 30px 0;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
        }
        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,0.3);
        }
        .empty .icon { font-size: 48px; margin-bottom: 16px; }
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.94);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 40px;
            cursor: pointer;
        }
        .overlay.active { display: flex; }
        .overlay .close {
            position: absolute;
            top: 30px; right: 40px;
            color: #fff;
            font-size: 36px;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
            z-index: 10;
        }
        .overlay .close:hover { opacity: 1; }
        .overlay img {
            max-width: 95%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .overlay .meta {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 10px 24px;
            border-radius: 24px;
            max-width: 80%;
            pointer-events: none;
        }
        /* 响应式 */
        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(5, 1fr); } }
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .header { flex-direction: column; align-items: stretch; gap: 12px; }
            .header .info-badge { margin-left: 0; }
        }
        @media (max-width: 500px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
    </style>
</head>
<body>

    <header class="header">
        <h1>🌅 <span>必应</span>壁纸</h1>
        <span class="info-badge" id="infoBadge">加载中...</span>
    </header>

    <div class="grid" id="grid">
        <div class="card featured">
            <div class="logo">Bing <span>Wallpaper</span></div>
            <div class="sub">每日精选</div>
            <div class="count" id="totalCount">加载中...</div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeOverlay()">
        <span class="close">&times;</span>
        <img id="previewImg" src="" alt="预览" />
        <div class="meta" id="previewMeta"></div>
    </div>

    <script>
        // ============================================================
        // 1. 自动适配部署路径（关键修复）
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname; // 例如: "/bing-img/" 或 "/bing-img/index.html"
            // 如果路径以 .html 结尾，去掉文件名
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            // 去掉末尾的斜杠
            return path.replace(/\/$/, '');
        }

        const BASE_PATH = getBasePath(); // 结果会是 "/bing-img" 或空字符串
        console.log('📁 部署路径:', BASE_PATH || '/');

        // ============================================================
        // 2. 数据加载与渲染
        // ============================================================
        let allData = [];
        let currentPage = 0;
        const PAGE_SIZE = 28;
        let isLoading = false;
        let hasMore = true;
        const grid = document.getElementById('grid');

        async function loadData() {
            try {
                // 关键修改：使用 BASE_PATH 拼接完整路径
                const url = `${BASE_PATH}/data/wallpapers.json`;
                console.log('📡 请求数据:', url);
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    return;
                }
                document.getElementById('totalCount').textContent = `共 ${allData.length} 张`;
                document.getElementById('infoBadge').textContent = `📸 ${allData.length} 张壁纸`;
                hasMore = true;
                currentPage = 0;
                renderMore();
            } catch (err) {
                console.error('❌ 加载失败:', err);
                document.getElementById('infoBadge').textContent = '⚠️ 加载失败';
                showEmpty();
            }
        }

        function showEmpty() {
            document.getElementById('totalCount').textContent = '暂无壁纸';
            const loader = grid.querySelector('.loader');
            if (loader) loader.remove();
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.innerHTML = `
                <div class="icon">🖼️</div>
                <div>还没有壁纸数据</div>
                <div style="font-size:13px;color:rgba(255,255,255,0.2);margin-top:8px;">
                    请运行 <code>npm run fetch</code> 抓取壁纸
                </div>
            `;
            grid.appendChild(empty);
        }

        function renderMore() {
            if (isLoading || !hasMore || allData.length === 0) return;
            isLoading = true;

            const start = currentPage * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allData.length);
            const slice = allData.slice(start, end);

            if (slice.length === 0) {
                hasMore = false;
                isLoading = false;
                return;
            }

            const loader = grid.querySelector('.loader');
            if (loader) loader.remove();

            slice.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                // 优先使用 webp
                const imgSrc = item.webp || item.jpg || '';
                if (!imgSrc) return;
                card.innerHTML = `
                    <img src="${imgSrc}" alt="${item.copyright || item.date}" loading="lazy" 
                         onerror="this.src='${item.jpg || ''}'" />
                    <div class="info">
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title || item.copyright || '无标题'}</div>
                        <div class="copyright">${item.copyright || ''}</div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    const fullImg = item.jpg || item.webp || imgSrc;
                    openPreview(fullImg, item);
                });
                grid.appendChild(card);
            });

            currentPage++;
            isLoading = false;

            if (end >= allData.length) {
                hasMore = false;
            } else {
                const loader = document.createElement('div');
                loader.className = 'loader';
                loader.innerHTML = `⏳ 加载中...`;
                grid.appendChild(loader);
            }
        }

        function handleScroll() {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;
            if (scrollY + windowHeight >= documentHeight - 300) {
                renderMore();
            }
        }

        // ============================================================
        // 3. 全屏预览
        // ============================================================
        function openPreview(src, meta) {
            const overlay = document.getElementById('overlay');
            document.getElementById('previewImg').src = src;
            document.getElementById('previewMeta').innerHTML = `
                ${meta.title || meta.copyright || ''} 
                <span style="opacity:0.6;font-size:12px;"> · ${meta.date}</span>
            `;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeOverlay() {
            document.getElementById('overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeOverlay();
        });

        // ============================================================
        // 4. 启动
        // ============================================================
        window.addEventListener('scroll', handleScroll);
        loadData();
    </script>

</body>
</html>
