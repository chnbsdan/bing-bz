<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --bg-primary: #0d0d1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #1a1a2e;
            --text-primary: #fff;
            --text-secondary: rgba(255,255,255,0.4);
            --text-muted: rgba(255,255,255,0.2);
            --text-faint: rgba(255,255,255,0.15);
            --border-color: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --nav-bg: rgba(13,13,26,0.92);
            --pagination-bg: rgba(13,13,26,0.85);
            --shadow-color: rgba(0,0,0,0.5);
            --overlay-bg: rgba(0,0,0,0.92);
            --card-bg: #1a1a2e;
            --input-bg: rgba(255,255,255,0.05);
            --input-border: rgba(255,255,255,0.06);
            --btn-hover: rgba(255,255,255,0.08);
            --scrollbar-thumb: rgba(255,255,255,0.15);
            --scrollbar-thumb-hover: rgba(255,255,255,0.25);
            --progress-bar: linear-gradient(90deg, #4fc3f7, #00e5ff);
            --accent-color: #4fc3f7;
            --accent-hover: rgba(79,195,247,0.2);
            --detail-panel-bg: #1a1a2e;
        }

        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0,0,0,0.5);
            --text-muted: rgba(0,0,0,0.2);
            --text-faint: rgba(0,0,0,0.1);
            --border-color: rgba(0,0,0,0.06);
            --border-hover: rgba(0,0,0,0.12);
            --nav-bg: rgba(255,255,255,0.92);
            --pagination-bg: rgba(255,255,255,0.85);
            --shadow-color: rgba(0,0,0,0.1);
            --overlay-bg: rgba(255,255,255,0.92);
            --card-bg: #ffffff;
            --input-bg: rgba(0,0,0,0.04);
            --input-border: rgba(0,0,0,0.08);
            --btn-hover: rgba(0,0,0,0.06);
            --scrollbar-thumb: rgba(0,0,0,0.15);
            --scrollbar-thumb-hover: rgba(0,0,0,0.25);
            --detail-panel-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
            color: var(--text-primary);
        }

        /* ===== 进度条 ===== */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2.5px;
            background: var(--progress-bar);
            width: 0%;
            z-index: 9999;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(79, 195, 247, 0.4);
        }

        /* ===== ☰ 按钮 ===== */
        .nav-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1001;
            background: var(--nav-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 20px;
            padding: 6px 12px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }

        .nav-toggle:hover {
            background: var(--accent-hover);
            border-color: rgba(79, 195, 247, 0.2);
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 12px;
            left: 56px;
            z-index: 1000;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            box-shadow: 0 8px 32px var(--shadow-color);
            max-width: 90vw;
        }

        .navbar.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .navbar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .navbar .logo {
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar .logo span {
            color: var(--accent-color);
            font-weight: 600;
        }

        .navbar .badge {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .navbar .badge span {
            color: var(--text-muted);
        }

        .navbar .search-box {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .navbar .search-box input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            padding: 5px 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        .navbar .search-box input:focus {
            border-color: var(--accent-color);
            background: var(--input-bg);
        }

        .navbar .search-box input::placeholder {
            color: var(--text-muted);
        }

        .navbar .search-box .search-btn {
            background: var(--accent-hover);
            border: none;
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .navbar .search-box .search-btn:hover {
            background: rgba(79, 195, 247, 0.25);
            color: var(--text-primary);
        }

        .navbar .nav-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .navbar .nav-actions a,
        .navbar .nav-actions button {
            background: var(--input-bg);
            border: none;
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .navbar .nav-actions a:hover,
        .navbar .nav-actions button:hover {
            background: var(--btn-hover);
            color: var(--text-primary);
        }

        #themeToggle {
            background: var(--accent-hover);
            color: var(--accent-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #themeToggle:hover {
            background: rgba(79, 195, 247, 0.3);
            color: var(--text-primary);
        }

        /* ===== 应用容器 ===== */
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        /* ===== 网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            flex: 1;
            align-content: start;
            overflow-y: auto;
            padding: 4px;
            padding-bottom: 70px;
            scroll-behavior: smooth;
            min-height: 0;
        }

        .grid::-webkit-scrollbar {
            width: 6px;
        }

        .grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }

        .grid::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* ===== 卡片 ===== */
        .card {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            background: var(--bg-card);
            aspect-ratio: 16 / 9;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card img.loaded {
            opacity: 1;
        }

        .card .placeholder-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.7);
            transform: scale(1.05);
            transition: opacity 0.6s ease;
            z-index: 1;
        }

        .card .placeholder-bg.hidden {
            opacity: 0;
        }

        .card .info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 16px 12px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            color: #fff;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .card:hover .info {
            opacity: 1;
        }

        .card .info .date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .card .info .title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .info .copyright {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 分页控制栏 ===== */
        .pagination {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--pagination-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 32px var(--shadow-color);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .pagination button {
            background: var(--input-bg);
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--accent-hover);
            color: var(--accent-color);
        }

        .pagination button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

        .pagination .total-info {
            color: var(--text-muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .pagination .goto-box {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pagination .goto-box input {
            width: 48px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 4px 6px;
            color: var(--text-primary);
            font-size: 13px;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        .pagination .goto-box input:focus {
            border-color: var(--accent-color);
        }

        .pagination .goto-box .goto-btn {
            background: var(--accent-hover);
            border: none;
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pagination .goto-box .goto-btn:hover {
            background: rgba(79, 195, 247, 0.3);
            color: var(--text-primary);
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* ============================================================
           全屏预览遮罩
           ============================================================ */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay-bg);
            z-index: 999;
            overflow: hidden;
            user-select: none;
            transition: background 0.3s ease;
        }

        .overlay.active {
            display: block;
        }

        .overlay .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            overflow: hidden;
            position: relative;
        }

        .overlay .image-container:active {
            cursor: grabbing;
        }

        .overlay .preview-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
            transition: none;
            background: var(--overlay-bg);
        }

        /* ---- 左右箭头 ---- */
        .overlay .arrow {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 80px;
            cursor: pointer;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 32px;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .overlay .arrow-left {
            left: 0;
        }

        .overlay .arrow-right {
            right: 0;
        }

        .overlay .arrow:hover {
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.6);
        }

        /* ---- 右上角操作按钮 ---- */
        .overlay .action-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 70;
        }

        .overlay .action-buttons button,
        .overlay .action-buttons a {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            white-space: nowrap;
        }

        .overlay .action-buttons button:hover,
        .overlay .action-buttons a:hover {
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .overlay .action-buttons .btn-download {
            color: var(--accent-color);
            border-color: rgba(79, 195, 247, 0.15);
        }

        .overlay .action-buttons .btn-download:hover {
            background: var(--accent-hover);
            color: var(--text-primary);
            border-color: var(--accent-color);
        }

        .overlay .action-buttons .btn-detail {
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .overlay .action-buttons .btn-detail:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.9);
        }

        .overlay .action-buttons .btn-close {
            background: rgba(0, 0, 0, 0.3);
            border-color: transparent;
            padding: 8px 12px;
            font-size: 16px;
        }

        .overlay .action-buttons .btn-close:hover {
            background: rgba(255, 50, 50, 0.2);
            color: #ff6b6b;
            border-color: rgba(255, 50, 50, 0.2);
        }

        /* ---- 底部图片信息 ---- */
        .overlay .meta {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            text-align: center;
            z-index: 50;
            pointer-events: none;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 0, 0, 0.4);
            line-height: 1.6;
            max-width: 80%;
        }

        .overlay .meta .date {
            font-size: 13px;
            opacity: 0.4;
            display: block;
            margin-top: 2px;
        }

        /* ============================================================
           右侧详情面板
           ============================================================ */
        .detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 80;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .detail-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .detail-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 90vw;
            height: 100%;
            background: var(--detail-panel-bg);
            z-index: 90;
            box-shadow: -8px 0 40px var(--shadow-color);
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid var(--border-color);
        }

        .detail-panel.open {
            right: 0;
        }

        .detail-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .detail-panel-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-panel-header h2 i {
            color: var(--accent-color);
        }

        .detail-panel-close {
            background: var(--input-bg);
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-panel-close:hover {
            background: var(--btn-hover);
            color: var(--text-primary);
        }

        .detail-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .detail-panel-body::-webkit-scrollbar {
            width: 4px;
        }

        .detail-panel-body::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 2px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .detail-value {
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.5;
            word-break: break-word;
        }

        .detail-value a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .detail-value a:hover {
            text-decoration: underline;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1200px) {
            .grid { grid-template-columns: repeat(5, 1fr); }
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .navbar { left: 52px; min-width: 160px; padding: 12px 14px; top: 10px; }
            .nav-toggle { font-size: 18px; padding: 5px 10px; top: 10px; left: 10px; }
            .pagination { padding: 6px 12px; gap: 6px; bottom: 12px; }
            .pagination button { font-size: 12px; padding: 4px 10px; }
            .pagination .page-info { font-size: 12px; }
            .pagination .goto-box input { width: 40px; font-size: 12px; }
        }

        @media (max-width: 500px) {
            .app { height: auto; min-height: 100vh; overflow-y: auto; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 0; height: auto; overflow-y: visible; padding: 0; padding-bottom: 80px; align-content: start; }
            .card { aspect-ratio: 16 / 10; border-radius: 0; }
            .navbar { left: 48px; min-width: 140px; padding: 10px 12px; top: 8px; }
            .navbar .logo { font-size: 14px; }
            .navbar .search-box input { font-size: 12px; padding: 4px 8px; }
            .navbar .nav-actions a,
            .navbar .nav-actions button { font-size: 12px; padding: 4px 8px; }
            #themeToggle { width: 28px; height: 28px; font-size: 13px; }
            .nav-toggle { font-size: 16px; padding: 4px 8px; top: 8px; left: 8px; }
            .pagination { flex-wrap: wrap; justify-content: center; padding: 6px 10px; gap: 4px; max-width: 98vw; bottom: 8px; }
            .pagination button { font-size: 11px; padding: 3px 8px; }
            .pagination .page-info { font-size: 11px; }
            .pagination .total-info { font-size: 10px; }
            .pagination .goto-box input { width: 34px; font-size: 11px; padding: 2px 4px; }
            .pagination .goto-box .goto-btn { font-size: 11px; padding: 2px 8px; }

            .overlay .arrow { width: 50px; font-size: 22px; }
            .overlay .action-buttons { top: 12px; right: 12px; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
            .overlay .action-buttons button,
            .overlay .action-buttons a { font-size: 11px; padding: 4px 10px; }
            .overlay .action-buttons .btn-close { padding: 4px 10px; font-size: 14px; }
            .overlay .meta { font-size: 13px; bottom: 30px; max-width: 90%; }
            .overlay .meta .date { font-size: 11px; }

            .detail-panel { width: 100%; max-width: 100vw; right: -100vw; }
            .detail-panel.open { right: 0; }
            .detail-panel-header { padding: 16px 20px; }
            .detail-panel-header h2 { font-size: 16px; }
            .detail-panel-body { padding: 16px 20px; }
            .detail-item { padding: 12px 0; }
            .detail-value { font-size: 14px; }
        }

        @media (pointer: coarse) {
            .overlay .arrow { width: 60px; color: rgba(255, 255, 255, 0.25); }
        }
    </style>
</head>
<body>

    <!-- ===== 进度条 ===== -->
    <div id="progress-bar"></div>

    <!-- ===== ☰ 按钮 ===== -->
    <button class="nav-toggle" id="navToggle" aria-label="切换导航">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ===== 导航栏 ===== -->
    <div class="navbar" id="navbar">
        <div class="navbar-header">
            <div class="logo">
                <img src="/favicon.ico" alt="Logo" style="width:24px;height:24px;border-radius:4px;" />
                Bing <span>Wallpaper</span>
            </div>
        </div>
        <div class="badge"><i class="fas fa-images"></i> <span id="totalNavCount">0</span> 张</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索年份/关键词..." />
            <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
        <div class="nav-actions">
            <button id="homeBtn"><i class="fas fa-home"></i> 首页</button>
            <a href="/api" target="_blank"><i class="fas fa-code"></i> API</a>
            <a href="https://aoso.hangdn.com" target="_blank" rel="noopener"><i class="fas fa-blog"></i> 博客</a>
            <button id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <!-- ===== 应用容器 ===== -->
    <div class="app">
        <div class="grid" id="grid"></div>
    </div>

    <!-- ===== 分页控制栏 ===== -->
    <div class="pagination" id="pagination">
        <button id="prevBtn" disabled><i class="fas fa-chevron-left"></i> 上一页</button>
        <span class="page-info" id="pageInfo">第 1 / 1 页</span>
        <span class="total-info" id="totalInfo"><i class="fas fa-images"></i> 共 0 张</span>
        <button id="nextBtn">下一页 <i class="fas fa-chevron-right"></i></button>

        <div class="goto-box">
            <input type="number" id="gotoInput" min="1" placeholder="页" />
            <button class="goto-btn" id="gotoBtn"><i class="fas fa-arrow-right"></i> 跳转</button>
        </div>
    </div>

    <!-- ===== 全屏预览遮罩 ===== -->
    <div class="overlay" id="overlay">
        <div class="image-container" id="imageContainer">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>

        <button class="arrow arrow-left" id="prevPreviewBtn">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="arrow arrow-right" id="nextPreviewBtn">
            <i class="fas fa-chevron-right"></i>
        </button>

        <div class="action-buttons">
            <button class="btn-download" id="downloadBtn"><i class="fas fa-download"></i> 下载</button>
            <button class="btn-detail" id="detailBtn"><i class="fas fa-circle-info"></i> 详情</button>
            <button class="btn-close" id="closeBtn"><i class="fas fa-times"></i></button>
        </div>

        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>

        <!-- 右侧详情面板 -->
        <div class="detail-overlay" id="detailOverlay"></div>
        <div class="detail-panel" id="detailPanel">
            <div class="detail-panel-header">
                <h2><i class="fas fa-circle-info"></i> 图片详情</h2>
                <button class="detail-panel-close" id="detailPanelClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="detail-panel-body">
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-calendar-day"></i> 日期</span>
                    <span class="detail-value" id="detailDate">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-tag"></i> 标题</span>
                    <span class="detail-value" id="detailTitle">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-copyright"></i> 版权</span>
                    <span class="detail-value" id="detailCopyright">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-globe"></i> 地区</span>
                    <span class="detail-value" id="detailLocale">-</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-image"></i> 分辨率</span>
                    <span class="detail-value" id="detailResolution">1920 x 1080</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label"><i class="fas fa-link"></i> 原图链接</span>
                    <span class="detail-value"><a href="#" id="detailLink" target="_blank"><i class="fas fa-external-link-alt"></i> 打开原图</a></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 路径适配
        // ============================================================
        function getBasePath() {
            const path = window.location.pathname;
            if (path.endsWith('.html')) {
                return path.substring(0, path.lastIndexOf('/'));
            }
            return path.replace(/\/$/, '');
        }
        const BASE_PATH = getBasePath();

        function getImageUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            if (url.startsWith('/')) return `${BASE_PATH}${url}`;
            return url;
        }

        // ============================================================
        // 2. 主题切换
        // ============================================================
        const themeToggle = document.getElementById('themeToggle');
        let currentTheme = localStorage.getItem('theme') || 'dark';

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.innerHTML = theme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        }
        themeToggle.addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));
        setTheme(currentTheme);

        // ============================================================
        // 3. 进度条
        // ============================================================
        const progressBar = document.getElementById('progress-bar');

        function showProgress() {
            progressBar.style.width = '30%';
            setTimeout(() => progressBar.style.width = '60%', 150);
        }

        function hideProgress() {
            progressBar.style.width = '100%';
            setTimeout(() => progressBar.style.width = '0%', 350);
        }

        // ============================================================
        // 4. 导航栏
        // ============================================================
        const navToggle = document.getElementById('navToggle');
        const navbar = document.getElementById('navbar');
        let navOpen = false;

        navToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            navOpen = !navOpen;
            navbar.classList.toggle('open', navOpen);
            navToggle.innerHTML = navOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
        });

        document.addEventListener('click', (e) => {
            if (navOpen && !navbar.contains(e.target) && e.target !== navToggle) {
                navOpen = false;
                navbar.classList.remove('open');
                navToggle.innerHTML = '<i class="fas fa-bars"></i>';
            }
        });

        // ============================================================
        // 5. 数据加载
        // ============================================================
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const PAGE_SIZE = window.innerWidth <= 500 ? 12 : 42;
        let totalPages = 1;
        let currentPreviewIndex = 0;
        let currentPreviewItem = null;

        const grid = document.getElementById('grid');
        const overlay = document.getElementById('overlay');
        const imageContainer = document.getElementById('imageContainer');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');
        const previewDate = document.getElementById('previewDate');
        const totalNavCount = document.getElementById('totalNavCount');
        const openLinkBtn = document.getElementById('openLinkBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const detailBtn = document.getElementById('detailBtn');
        const detailPanel = document.getElementById('detailPanel');
        const detailPanelClose = document.getElementById('detailPanelClose');
        const detailOverlay = document.getElementById('detailOverlay');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const homeBtn = document.getElementById('homeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');
        const totalInfo = document.getElementById('totalInfo');
        const gotoInput = document.getElementById('gotoInput');
        const gotoBtn = document.getElementById('gotoBtn');
        const closeBtn = document.getElementById('closeBtn');

        let scale = 1;
        let minScale = 0.3;
        let maxScale = 5;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let startX = 0,
            startY = 0,
            lastTranslateX = 0,
            lastTranslateY = 0;

        // ============================================================
        // 5.1 加载数据
        // ============================================================
        async function loadData() {
            showProgress();
            try {
                const url = `${BASE_PATH}/data/wallpapers.json`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allData = await res.json();
                if (!Array.isArray(allData) || allData.length === 0) {
                    showEmpty();
                    hideProgress();
                    return;
                }
                allData.sort((a, b) => b.date.localeCompare(a.date));
                filteredData = [];
                totalNavCount.textContent = allData.length;
                totalInfo.innerHTML = `<i class="fas fa-images"></i> 共 ${allData.length} 张`;
                currentPage = 1;
                renderPage(1);
                hideProgress();
            } catch (err) {
                console.error('加载失败:', err);
                showEmpty();
                hideProgress();
            }
        }

        // ============================================================
        // 5.2 渲染
        // ============================================================
        function renderPage(page) {
            const data = filteredData.length > 0 ? filteredData : allData;
            totalPages = Math.ceil(data.length / PAGE_SIZE);
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            if (totalPages === 0) { showEmpty(); return; }

            currentPage = page;
            const start = (page - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, data.length);
            const items = data.slice(start, end);

            grid.innerHTML = '';
            if (items.length === 0) { showEmpty(); return; }

            items.forEach((item, index) => {
                const realIndex = start + index;
                const card = document.createElement('div');
                card.className = 'card';
                const imgSrc = getImageUrl(item.webp || item.jpg || '');
                const fallback = getImageUrl(item.jpg || '');

                let placeholderSrc = imgSrc;
                if (imgSrc.includes('th?id=')) {
                    placeholderSrc = imgSrc.includes('?') ? `${imgSrc}&w=200` : `${imgSrc}?w=200`;
                }

                card.innerHTML = `
                        <div class="placeholder-bg" style="background-image: url('${placeholderSrc}');"></div>
                        <img src="${imgSrc}" alt="${item.copyright || item.date}" loading="lazy" />
                        <div class="info">
                            <div class="date">${item.date}</div>
                            <div class="title">${item.copyright || '无标题'}</div>
                            <div class="copyright">${item.copyright || ''}</div>
                        </div>
                    `;

                const img = card.querySelector('img');
                const placeholderBg = card.querySelector('.placeholder-bg');

                img.addEventListener('load', () => {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                });
                if (img.complete) {
                    img.classList.add('loaded');
                    placeholderBg.classList.add('hidden');
                }
                img.addEventListener('error', () => {
                    if (fallback && fallback !== imgSrc) {
                        img.src = fallback;
                    } else {
                        img.classList.add('loaded');
                        placeholderBg.classList.add('hidden');
                    }
                });

                card.addEventListener('click', () => {
                    let targetIndex = realIndex;
                    if (allData.length > 0) {
                        const found = allData.findIndex(d => d.date === item.date);
                        if (found >= 0) targetIndex = found;
                    }
                    openPreview(targetIndex);
                });

                grid.appendChild(card);
            });

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
            pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
            gotoInput.max = totalPages;
            gotoInput.placeholder = `1-${totalPages}`;
            grid.scrollTop = 0;
        }

        // ============================================================
        // 5.3 分页
        // ============================================================
        prevBtn.addEventListener('click', () => { if (currentPage > 1) renderPage(currentPage - 1); });
        nextBtn.addEventListener('click', () => { if (currentPage < totalPages) renderPage(currentPage + 1); });
        gotoBtn.addEventListener('click', () => {
            const val = parseInt(gotoInput.value);
            if (!isNaN(val) && val >= 1 && val <= totalPages) renderPage(val);
            gotoInput.value = '';
        });
        gotoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') gotoBtn.click(); });

        // ============================================================
        // 5.4 搜索
        // ============================================================
        function doSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) { filteredData = []; renderPage(1); return; }
            filteredData = allData.filter(item => {
                const copyright = (item.copyright || '').toLowerCase();
                const date = item.date || '';
                const dateClean = date.replace(/-/g, '');
                return copyright.includes(keyword) || date.includes(keyword) || dateClean.includes(keyword);
            });
            if (filteredData.length === 0) {
                grid.innerHTML =
                    `<div class="empty"><div class="icon"><i class="fas fa-search"></i></div><div>没有匹配"${keyword}"的壁纸</div></div>`;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                pageInfo.textContent = '第 0 / 0 页';
                return;
            }
            renderPage(1);
        }
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
        homeBtn.addEventListener('click', () => { searchInput.value = ''; filteredData = []; renderPage(1);
            toggleNav(false); });

        // ============================================================
        // 5.5 空状态
        // ============================================================
        function showEmpty() {
            grid.innerHTML =
                `<div class="empty"><div class="icon"><i class="fas fa-image"></i></div><div>暂无壁纸数据</div></div>`;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            pageInfo.textContent = '第 0 / 0 页';
            totalInfo.innerHTML = '<i class="fas fa-images"></i> 共 0 张';
            totalNavCount.textContent = '0';
        }

        // ============================================================
        // 6. 全屏预览
        // ============================================================
        function openPreview(index) {
            if (allData.length === 0) return;
            index = Math.max(0, Math.min(index, allData.length - 1));
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];
            resetZoom();
            showPreview(currentPreviewIndex);
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            updateActionButtons();
        }

        function showPreview(index) {
            if (allData.length === 0) return;
            index = (index + allData.length) % allData.length;
            currentPreviewIndex = index;
            currentPreviewItem = allData[currentPreviewIndex];

            const imgSrc = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            previewImg.src = imgSrc;
            previewTitle.textContent = currentPreviewItem.copyright || '';
            previewDate.textContent = currentPreviewItem.date || '';
            updateActionButtons();
            resetZoom();
        }

        function updateActionButtons() {
            if (!currentPreviewItem) return;
            const url = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp || '');
            openLinkBtn.href = url;
            downloadBtn.onclick = (e) => {
                e.preventDefault();
                downloadImage(url);
            };
        }

        async function downloadImage(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                const fileName = url.split('/').pop().split('?')[0] || 'wallpaper.jpg';
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch {
                window.open(url, '_blank');
            }
        }

        function closePreview() {
            overlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            closeDetailPanel();
        }

        // ============================================================
        // 7. 详情面板
        // ============================================================
        function openDetailPanel() {
            if (!currentPreviewItem) return;
            document.getElementById('detailDate').textContent = currentPreviewItem.date || '-';
            document.getElementById('detailTitle').textContent = currentPreviewItem.copyright || currentPreviewItem.title ||
                '-';
            document.getElementById('detailCopyright').textContent = currentPreviewItem.copyright || '-';
            document.getElementById('detailLocale').textContent = currentPreviewItem.locale || 'zh-CN';
            document.getElementById('detailLink').href = getImageUrl(currentPreviewItem.jpg || currentPreviewItem.webp ||
                '');
            document.getElementById('detailResolution').textContent = '1920 x 1080';

            detailPanel.classList.add('open');
            detailOverlay.classList.add('active');
        }

        function closeDetailPanel() {
            detailPanel.classList.remove('open');
            detailOverlay.classList.remove('active');
        }

        detailBtn.addEventListener('click', openDetailPanel);
        detailPanelClose.addEventListener('click', closeDetailPanel);
        detailOverlay.addEventListener('click', closeDetailPanel);

        // ============================================================
        // 8. 缩放与拖拽
        // ============================================================
        function updateTransform() {
            previewImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        }

        function startDrag(e) {
            if (scale <= 1) return;
            isDragging = true;
            const pos = e.type === 'mousedown' ? e : e.touches[0];
            startX = pos.clientX;
            startY = pos.clientY;
            lastTranslateX = translateX;
            lastTranslateY = translateY;
            imageContainer.style.cursor = 'grabbing';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = e.type === 'mousemove' ? e : e.touches[0];
            translateX = lastTranslateX + pos.clientX - startX;
            translateY = lastTranslateY + pos.clientY - startY;
            updateTransform();
        }

        function endDrag() {
            isDragging = false;
            imageContainer.style.cursor = 'grab';
        }

        function wheelZoom(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.15 : 0.15;
            scale = Math.min(Math.max(scale + delta, minScale), maxScale);
            if (scale <= 1) { translateX = 0;
                translateY = 0; }
            updateTransform();
        }

        // ============================================================
        // 9. 事件绑定
        // ============================================================
        closeBtn.addEventListener('click', closePreview);
        document.getElementById('prevPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex - 1);
        });
        document.getElementById('nextPreviewBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPreview(currentPreviewIndex + 1);
        });

        imageContainer.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('mouseup', endDrag);

        imageContainer.addEventListener('touchstart', startDrag, { passive: true });
        document.addEventListener('touchmove', moveDrag, { passive: false });
        document.addEventListener('touchend', endDrag, { passive: true });

        imageContainer.addEventListener('wheel', wheelZoom, { passive: false });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closePreview();
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
            if (e.key === 'ArrowLeft') showPreview(currentPreviewIndex - 1);
            if (e.key === 'ArrowRight') showPreview(currentPreviewIndex + 1);
            if (e.key === 'Escape' && detailPanel.classList.contains('open')) {
                closeDetailPanel();
            }
        });

        // ============================================================
        // 10. 启动
        // ============================================================
        loadData();
    </script>

</body>
</html>
